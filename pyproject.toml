[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkws"
version = "0.1.0"
description = "文件目录型数据知识服务模拟平台 (Data Knowledge Workspace Service) - DKWS-SPEC-001 V1.0 实现"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "kuzu>=0.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
dkws = "dkws.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
