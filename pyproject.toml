[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kert"
version = "0.1.0"
description = "文件目录型数据知识服务模拟平台 (Data Knowledge Workspace Service) - KERT-SPEC-001 V1.0 实现"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "kuzu>=0.11",
    # D-31（Owner 2026-09-16，**推翻** D3-A「KERT 不内置本体」）：本体**真解析**的最小集合 ——
    # rdflib 解析 OWL/TTL，pyshacl 解析并施加 SHACL 约束（`kert.domain.ontology_parse`）。
    # 刻意**不**引入 owlready2 / 推理机：当前需求是"可解析、可统计、可物化"，不是"可推理"；
    # 将来若确需推理，再按最小化原则单独追加并留痕。
    "rdflib>=7.6",
    "pyshacl>=0.40",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# httpx 是测试依赖：tests/e2e 直接使用 httpx，
# tests/integration 经 starlette.testclient.TestClient 间接依赖它
# （TestClient 缺 httpx 会抛 RuntimeError 而非 ImportError）。
# 此前 httpx 仅出现在 requirements-lock.txt，未在任何 extra 中声明；
# 而 `pip install -c requirements-lock.txt ".[api,dev]"` 中的 -c 是**约束**
# 而非安装指令，只钉版本、不会安装未被依赖声明引入的包，
# 因此 CI 缺 httpx，导致 e2e / integration 用例收集失败。
# jsonschema 同样是测试依赖：tests/unit/test_skills_capability_swap_guards.py 与
# tests/integration/test_skill_routing_trace.py 直接 `import jsonschema`。
# 与上一处**同形**的隐患：它此前只出现在 requirements-lock.txt（`-c` 只钉版本、
# 不安装未被声明引入的包）⇒ CI 在**收集期** ModuleNotFoundError
# （实测于 PR #6 首跑：2 个测试模块 collection error，整轮 exit 2）。
dev = ["pytest>=8.0", "httpx>=0.27", "jsonschema>=4.18"]

[project.scripts]
kert = "kert.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 裁决 D-10（Owner 已批 2026-09-16）：`perf` 标记的用例断言**墙钟阈值**，在多智能体
# 并发跑测下**结构性不可靠**（失败集合逐轮漂移，隔离复跑仍 FAIL）⇒ 移出**默认套件**。
# 显式运行：`python -m pytest -m perf ...`。
# 专职 perf job（.github/workflows/ci.yml）以 `-m "perf or not perf"` 覆盖本默认值，
# 否则该 job 会静默变成"零用例通过"。
addopts = ["-q", "-m", "not perf"]
markers = [
    "perf: 墙钟阈值性能基准；结构性不可靠，默认套件排除（见 D-10）",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 显式声明规则集，不依赖 ruff 的默认值。
# 原因：CI 此前用 `pip install ruff`（未锁版本），而 ruff 的默认规则集
# 随版本扩张（0.16 起默认已含 B/BLE/PLE/UP/FURB/PERF/S 等规则族）。
# 依赖默认值会让工具升级凭空引入红灯，与代码改动无关。
# 当前基线 = ruff 早期默认集，即团队引入 Lint 时的隐含预期强度。
# 收紧计划见 evidence/jr1/TASK_PACKAGE_LINT_BASELINE.md（JR1-LINT-BASELINE），
# 其中 PLE1205（19 处日志参数不匹配）为运行时真实缺陷，优先修复。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试模块需要在 import 前做路径/环境准备，E402 在此为有意为之
"tests/**" = ["E402"]
