# KERT 单节点部署编排（M2.7）
#
# 依 ADR-015 单机单实例：不引入 Kubernetes、不引入 Redis/MQ。
# 服务清单：
#   - provision  一次性控制面供给（P2）：api/worker 启动**之前**执行，见下方注释
#   - api     Python Core，唯一公共入口
#   - worker  持久化异步 Worker（无 HTTP 端口）
#
# TLS 由外层反向代理终止，本编排只在**回环**暴露端口
# （见 KERT_HYBRID_DEPLOYMENT_AND_OPERATIONS §2.2）。
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 填入 API Key
#   docker compose -f deploy/docker-compose.yml up -d
#
# 注意：api 与 worker 共享同一 workspace volume——Worker 需读写
# 同一份 SQLite Runtime Store（ADR-015 单机单实例前提）。

services:
  # 控制面供给（P2，M7.3）：把受控控制面元数据（知识地图 / 路由策略 / 本体引用）
  # 装进 workspace 的一次性任务，**幂等**（内容未变则不改写）且**先全量校验后写入**
  # （源内任一份定义非法则一份都不写）。
  #
  # 为什么放在编排里而不是靠运维记得跑：严格 fail-closed 下，未供给的工作区会让
  # 三个 customer-engagement 技能**全部拒绝**；把供给并入启动链，才能让"忘了跑"
  # 在部署阶段就暴露，而不是在业务调用时暴露。缺 KERT_CONTROL_PLANE_SOURCE 时
  # compose 直接失败（与 KERT_API_KEYS 同一口径：宁可起不来，不要半配置起来）。
  provision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kert-python-core:local
    container_name: kert-provision
    restart: "no"
    entrypoint: ["kert", "provision"]
    command:
      - "-w"
      - "/data/workspace"
      - "-s"
      - "${KERT_CONTROL_PLANE_SOURCE:?需在 .env 声明控制面元数据源（容器内路径，如 /app/examples/bank-front-knowledge-maps）}"
    volumes:
      - workspace:/data/workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kert-python-core:local
    container_name: kert-api
    restart: unless-stopped
    # 供给成功后 api 才启动：未供给的服务起来也是"三技能全拒绝"的空壳
    depends_on:
      provision:
        condition: service_completed_successfully
    # 仅绑回环：对外暴露由反向代理负责，避免绕过 TLS 与网关策略
    ports:
      - "127.0.0.1:8106:8106"
    environment:
      KERT_PROFILE: prod
      KERT_BIND_HOST: 0.0.0.0
      KERT_API_KEYS: ${KERT_API_KEYS:?需在 .env 中配置 API Key，生产 profile 缺失将拒绝启动}
      KERT_RATE_LIMIT_ENABLED: "true"
      KERT_RATE_LIMIT_RPM: ${KERT_RATE_LIMIT_RPM:-600}
      KERT_SIZE_LIMIT_ENABLED: "true"
      KERT_CONCURRENCY_ENABLED: "true"
      KERT_RUNTIME_STORE_ENABLED: "true"
      KERT_STRUCTURED_LOGS: "true"
      KERT_LOG_LEVEL: ${KERT_LOG_LEVEL:-INFO}
      KERT_METRICS_ENABLED: "true"
      KERT_METRICS_REQUIRE_ADMIN: ${KERT_METRICS_REQUIRE_ADMIN:-true}
      KERT_LLM_REDACTION: "true"
      KERT_REDACT_RESPONSE: ${KERT_REDACT_RESPONSE:-false}
    volumes:
      - workspace:/data/workspace
      - backups:/data/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8106/livez"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # 安全加固：只读根文件系统 + 丢弃全部能力
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kert-python-core:local
    container_name: kert-worker
    restart: unless-stopped
    # Worker 无 HTTP 端口，覆盖镜像默认入口
    entrypoint: ["python", "/app/scripts/run_worker.py"]
    command: ["--workspace", "/data/workspace"]
    environment:
      KERT_PROFILE: prod
      KERT_RUNTIME_STORE_ENABLED: "true"
      KERT_STRUCTURED_LOGS: "true"
      KERT_LOG_LEVEL: ${KERT_LOG_LEVEL:-INFO}
      KERT_LLM_REDACTION: "true"
      KERT_WORKER_LEASE_SECONDS: ${KERT_WORKER_LEASE_SECONDS:-30}
      KERT_WORKER_POLL_INTERVAL: ${KERT_WORKER_POLL_INTERVAL:-1.0}
    volumes:
      - workspace:/data/workspace
      - backups:/data/backups
    depends_on:
      # 两个条件**都**要满足：worker 与 api 读写同一 workspace
      # 1) 控制面已供给（P2）：否则中途启动会读到空控制面
      # 2) api 健康：沿用既有编排约束
      provision:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------- 备份一次性服务 ----------
  # 手动触发：docker compose -f deploy/docker-compose.yml run --rm backup
  # 备份集写入 /data/backups，可通过 docker cp 或挂载取出
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kert-python-core:local
    container_name: kert-backup
    # 覆盖镜像默认入口，执行备份命令
    entrypoint: ["python", "/app/scripts/kert_ops.py"]
    command: ["backup", "--workspace", "/data/workspace", "--dest", "/data/backups"]
    environment:
      KERT_PROFILE: prod
      KERT_STRUCTURED_LOGS: "true"
      KERT_LOG_LEVEL: ${KERT_LOG_LEVEL:-INFO}
    volumes:
      - workspace:/data/workspace
      - backups:/data/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - backup

volumes:
  # 知识资产为权威源，必须持久化且纳入备份
  workspace:
    name: kert_workspace
  backups:
    name: kert_backups
