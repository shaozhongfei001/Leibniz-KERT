openapi: 3.0.3
info:
  title: KERT Skill Execution API
  description: |
    独立知识工程服务端 (KERT) API 规范。

    - v1.3 基线：单客户技能执行、健康检查、报告查看
    - v1.4 增量：SP-20 服务建议书（异步）、SP-21 交互记忆抽取、闸门协作端点
    - v1.5 增量：知识路由与激活计划（知识地图注册查询 / 路由裁决 / 可重放计划），**纯新增**
    - v1.5 修正：`assemblyTrace` 类型 `object` → `array`（合同长期与实现不符，已改正）
    - v1.5 修正（**2026-09-16，按实现核对**；由冲突 C-20 的归并候选分析发现，
      `evidence/m7-3/CANDIDATE-CONTRACT-MERGE-V1-V2.md` §2.5 的 F1/F3/F4/F5）：
      ① `JobStatusResponse` 扁平对象 → **标准信封**，新增 `JobStatusData`（`job_id` 等 snake_case 键）；
      ② `GateListResponse.gates[]` 的 `GateChecklistItem` → 新增 `GateDefinition`（资产形状）；
      ③ `GateAuditResponse` 去掉实现不存在的 `timestamp`/`auditPath`，改为回显真实记录；
      ④ `/api/skill/execute` 的 `404`：`ErrorResponse` → 新增 `SkillExecuteErrorResponse`（与 200 同构）；
      ⑤ `/v1/jobs/{jobId}` 的 `404`：`ErrorResponse` → 新增 `InfrastructureErrorResponse`。
      以上均为**按已运行实现**修正（未改实现、未改 `src/**`）。
      **须通知 GITS**：`data.status` 与 `data.skill_result` 的嵌套位置**保持不变**（GITS `DshJobPoller` 按此读取）。
      机械核对用例：`tests/integration/test_contract_shape_conformance.py`。
      仍待后续批次（本轮未做）：`/api/skill/execute` 的 `400`/`500` 声明、
      `/api/skill/report` 的 404 体、`/v1/knowledge-maps` 的 `422`/`500` 体均未按实测核对；
      `OpenAPI` 方言（3.0.3 vs 校验器要求的 3.1.0）与 8 处 `nullable` 亦未处理（归并 P2 验收条件）。
      另记一条**观察（不在本合同范围、本批不修）**：`_handle()` 对**非** `KERTException`
      的兜底分支会把 `str(exc)` 放进 `detail.error.message`（`_handle()` @ `src/kert/api/server.py:310-318`），
      与新增的未捕获异常处理器（只给通用 `INTERNAL_ERROR`）**口径不一致**，存在内部信息外泄面；
      列为后续议题（需另立批次，涉及 `_handle()` 全量调用点的行为变更）。
    - **v1.5.1 补丁（2026-09-16，更正性，非语义增量）**：
      Contract Owner 于 2026-09-15 追认的对象是 **`1.5.0` 的 additive 增量**
      （`docs/governance/KERT_PENDING_OWNER_DECISION_M7_EVOLUTION_V1.0.md` §0.1）；
      其后本文件被更正两次（`assemblyTrace` 类型：commit `62b967a`；形状更正：commit `f7749af`）
      ⇒ 同一版本号承载了两份内容，会让"追认"失去确切对象。故 bump 至 `1.5.1`：
      **追认覆盖 v1.5 的 additive 增量，本补丁为形状/错误响应更正**，不含新增能力。
      本补丁内容：① `/api/skill/execute` 的 `400`（**实测不可达**）→ `422` + `ValidationErrorResponse`；
      ② `/api/skill/report/{requestId}` 的 `404` 如实化（新增 `StringDetailErrorResponse`）；
      ③ `/v1/knowledge-maps` 的 `422`/`500` 如实化；
      ④ 新增 app 级异常处理器，使**未捕获异常**返回本合同声明的 `ErrorResponse` 信封（F4c，实现侧改动）；
      ⑤ `SkillHealthResponse` / `SkillBriefInfo` 按实测补齐 `service` 与 `skills[].version`（F7）。
      另：`/v1/*` 下 **9 条已实现但未登记**的路径属 **additive 扩展**（非形状更正），
      不并入本补丁，另出提案待 Contract Owner 追认：
      `evidence/m7-3/PROPOSAL_REGISTER_UNDECLARED_V1_PATHS.md`。
    - **v1.6.0（2026-09-16，Contract Owner 已批：A-6 选 A / A-9 删除）**：
      ① **A-6（additive）**：登记 9 条**已实现但合同未声明**的 `/v1/*` 路径 ——
      `/v1/extractions`、`/v1/extractions/{job_id}/result`、`/v1/entities/{entity_id}`、
      `/v1/data/query`、`/v1/search`、`/v1/graph/query`、`/v1/rules/evaluate`、
      `/v1/evidence/{object_id}`、`/v1/catalog`。**不改**任何既有路径 / 字段 / 状态码；
      每条配**机械核对用例**（`tests/integration/test_contract_shape_conformance.py`）
      与**集合级防复发断言**（合同 `/v1/*` 路径集合 == 实现 `app.routes` 集合 ± 显式豁免清单）。
      提案：`evidence/m7-3/PROPOSAL_REGISTER_UNDECLARED_V1_PATHS.md`。
      ② **A-9（删除项，单列，不计入上述"9 条新增"计数）**：`GET /v1/skills` **已从本合同移除**
      （Owner 裁定 2026-09-16）—— 该端点**声明了但实现不存在**（"声明了但不存在"比"未声明"更坏）；
      同轮同步 3 处孤儿引用：`examples/gits_adapter/python/kert_client.py`、
      `examples/gits_adapter/curl/list_skills.sh`（已失去意义 ⇒ **删除**）、
      `docs/development/M3_PLAN_GITS_INTEGRATION.md`。
    - **v1.6.2 补丁（2026-09-17，更正性，非语义增量）**：**形状与登记更正**（不改实现、不改 `src/**`、
      不改状态码）：① `HealthResponse`（`/v1/health`）由**扁平**对象更正为**实测信封形状**
      （`request_id`/`status`/`data`/`errors`/`meta` + `data = {status: OK|DEGRADED, service_version,
      data_version, runtime{8 键}}`）；② 信封 `status` 由"仅字符串 + 说明"升为 **`enum: [OK]`**
      （原状 = 客户端会收到未声明的值）；③ `RuleViolation.severity.WARNING` 与
      `ErrorResponse.status.exit_policy_no_new_evidence` **保留声明 + 注明"当前实现不可达"**
      （D-45/D-46，不删能力）；④ `GateAudit*.decision.WAIVED` 注明"外部结论如实镜像"（D-43）。
      ⑤ 机械核对现状：值域核对见 `tests/unit/test_contract_enum_single_source.py`；
      **形状级**核对本次未新增（建议后续批次以 `/v1/health` 试点：断言"实现返回键集合 == 合同声明键集合"）。
    - **v1.6.1 补丁（2026-09-16，更正性，非语义增量）**：**值域更正** —— `JobStatusData.status.enum`
      原声明 **4 值**（`[PENDING, RUNNING, COMPLETED, FAILED]`）**窄于实现**：实现可达域为 `JOB_STATES`
      （`src/kert/domain/states.py:11-14`，**9 值**），且仓内合同源 `src/kert/domain/contracts/specs.py:585`
      （`FieldSpec("status", …, enum=list(JOB_STATES))`）**早已是 9 值** ⇒ 本合同与该源**不一致**，
      属"合同窄于实现"的**更正**（**不改**任何请求/响应形状、不改状态机、不改状态码）。
      同轮落**值域机械核对用例**（`tests/unit/test_contract_enum_single_source.py`）：
      合同 `enum == list(JOB_STATES)`；**若日后合同要写子集 ⇒ 必须显式登记 + 写明理由**，否则该用例红。

    权威契约：`docs/skill-execute-api-contract-v1.4.md`
    v1.5 变更说明：`evidence/m7-3/CONTRACT_CHANGE_PROPOSAL_ROUTING_API.md`
    **追认：Contract Owner 于 2026-09-15 批准**（含上述 assemblyTrace 类型修正）；
    登记：`docs/governance/KERT_PENDING_OWNER_DECISION_M7_EVOLUTION_V1.0.md` §0.1
    本文档为**运行中权威**（服务实际实现）；v2 候选未批准，归并列 W8/Phase 0 收口（冲突 C-20）
  version: "1.6.2"
  contact:
    name: KERT Team
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:8106
    description: 本地开发（默认 DSH_BASE_URL）

tags:
  - name: Health
    description: 健康检查与探针
  - name: Skill
    description: Skill 执行与查询
  - name: Job
    description: 异步作业管理
  - name: Gate
    description: 闸门协作
  - name: Observability
    description: 可观测性
  - name: Routing
    description: 知识路由与激活计划

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: 服务健康检查
      description: 返回 KERT 服务整体健康状态和已注册技能清单
      operationId: getHealth
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                request_id: REQ-H-2026-09-17T00:00:00
                status: OK
                data:
                  status: OK
                  service_version: "1.0.0"
                  data_version: "2026.09.17.1"
                  runtime:
                    profile: dev
                    auth_enabled: false
                    rate_limit_enabled: false
                    size_limit_enabled: false
                    concurrency_enabled: false
                    runtime_store_enabled: true
                    schema_version: 1
                    warnings: []
                errors: []
                meta:
                  service_version: "1.0.0"
                  data_version: active
                  generated_at: "2026-09-17T00:00:00Z"

  /api/skill/health:
    get:
      tags: [Skill, Health]
      summary: Skill 子系统健康检查
      description: GITS 适配器使用的 Skill 健康检查端点，返回已注册技能清单
      operationId: getSkillHealth
      responses:
        "200":
          description: Skill 子系统健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillHealthResponse"
              example:
                status: ok
                service: customer-engagement
                skills:
                  - skillId: R1
                    name: 对公客户画像
                    version: "1.0.0"
                  - skillId: SP-20
                    name: 对公客户服务建议书生成
                    version: "1.0.0"
                  - skillId: SP-21
                    name: 交互记忆抽取
                    version: "1.0.0"

  # ── v1.6.0 / A-6：9 条「已实现但合同未声明」的 /v1/* 路径 ──
  # 依据：evidence/m7-3/PROPOSAL_REGISTER_UNDECLARED_V1_PATHS.md（Owner 已批：A-6 选 A）
  # 机械核对用例：tests/integration/test_contract_shape_conformance.py
  # 说明：新增条目一律写法与实现逐字段对齐；**查询参数 `as_of` 等此前无从得知者**
  # 在 description 中显式标注「实现有、此前未声明」。
  /v1/extractions:
    post:
      tags: [Query]
      summary: 提交领域抽取作业（异步，202）
      description: |
        **v1.6.0 新增（A-6）**：此前已实现但合同未声明。
        实现 `extract()` @ `src/kert/api/server.py:499-528`；请求模型 `ExtractionRequest`（`:151-158`）。
        ⚠ 本响应**不走** `_response()` 生成器：实现**手写信封**（`:516-526`），
        `status` 取值为 **`ACCEPTED`**（与其余 `/v1/*` 端点的 `OK` **不同义**）。
      operationId: createExtraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionRequest"
      responses:
        "202":
          description: 已受理（写 Work）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionsAcceptedResponse"
        "422":
          description: 领域 / 用法错误（`KERTException` → `_handle()`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"
        "500":
          description: 未捕获异常（app 级处理器 → `ErrorResponse` 信封）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/extractions/{job_id}/result:
    get:
      tags: [Query]
      summary: 查询抽取作业结果摘要
      description: |
        **v1.6.0 新增（A-6）**。实现 `extraction_result()` @ `src/kert/api/server.py:538-548`；
        响应为**标准信封**（`_response()`），结果摘要位于 `data` 内。
      operationId: getExtractionResult
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 抽取结果摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResultResponse"
        "404":
          description: 作业不存在（`KERTException` → `_handle()`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/entities/{entity_id}:
    get:
      tags: [Query]
      summary: 查询实体及其陈述
      description: |
        **v1.6.0 新增（A-6）**。实现 `entity()` @ `src/kert/api/server.py:550-556`；
        数据由 `KnowledgeService.get_entity` 给出（`src/kert/application/services.py:96-109`）。
        ⚠ 查询参数 **`as_of`**：**实现有、此前无从得知** —— 非空时按时间点过滤陈述。
      operationId: getEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema: {type: string}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date-time}
          description: 时间点；仅返回该时点有效的陈述（实现 `_active_on` 过滤）
      responses:
        "200":
          description: 实体与其陈述
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "422":
          description: 实体不存在（`AssetNotFoundError` → `_handle()`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/data/query:
    post:
      tags: [Query]
      summary: 数据集查询
      description: |
        **v1.6.0 新增（A-6）**。实现 `data_query()` @ `src/kert/api/server.py:558-565`；
        数据由 `KnowledgeService.data_query` 给出（`services.py:80-92`；`limit` **上限 1000**，超出抛 `UsageError`）。
      operationId: queryDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataQueryRequest"
      responses:
        "200":
          description: 数据集记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQueryResponse"
        "422":
          description: 用法错误（如 `limit > 1000`）→ `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/search:
    post:
      tags: [Query]
      summary: 片段检索（FULLTEXT / VECTOR / HYBRID）
      description: |
        **v1.6.0 新增（A-6）**。实现 `search()` @ `src/kert/api/server.py:567-574`；
        数据由 `KnowledgeService.search` 给出（`services.py:242-298`）。
      operationId: searchSegments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 检索命中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: 用法错误（非法 `mode`）→ `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/graph/query:
    post:
      tags: [Query]
      summary: 图谱查询（neighbor / closure / paths）
      description: |
        **v1.6.0 新增（A-6）**。实现 `graph()` @ `src/kert/api/server.py:576-587`；
        数据由 `KnowledgeService.graph` 给出（`services.py:113-238`，Kùzu 后端回退内存 BFS）。
        ⚠ 与 v2 候选（`docs/contracts/openapi/kert-openapi-v2.yaml`）的差异**以实现为准**：
        实现 `required` 为 `request_id` + `start_entity_ids`（v2 为 `start_entity_ids` + `mode`），
        且实现**多**一个 `as_of`、`max_depth` 默认 `1`、`max_nodes` 默认 `100`。
      operationId: queryGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQueryRequest"
      responses:
        "200":
          description: 图谱结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQueryResponse"
        "422":
          description: 用法错误（`max_depth > 10` / `max_nodes > 1000` / 非法 `direction`/`mode`）→ `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/rules/evaluate:
    post:
      tags: [Query]
      summary: 规则评估
      description: |
        **v1.6.0 新增（A-6）**。实现 `rules()` @ `src/kert/api/server.py:589-595`；
        数据由 `KnowledgeService.evaluate_rule` 给出（`services.py:318-369`）。
      operationId: evaluateRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleEvaluateRequest"
      responses:
        "200":
          description: 规则评估结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEvaluateResponse"
        "422":
          description: 领域 / 用法错误 → `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/evidence/{object_id}:
    get:
      tags: [Query]
      summary: 证据溯源链
      description: |
        **v1.6.0 新增（A-6）**。实现 `evidence()` @ `src/kert/api/server.py:597-620`；
        数据由 `KnowledgeService.trace` 给出（`services.py:373-...`）。
        附注：实现会在查询同时向 Runtime Store 写**审计镜像**（副作用，失败不阻断主流程，见 `:601-617`）。
      operationId: getEvidence
      parameters:
        - name: object_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 溯源链
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "422":
          description: 领域错误（如无活动投影 `ServiceNotReadyError`）→ `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /v1/catalog:
    get:
      tags: [Query]
      summary: 服务目录（服务 ID / 活动版本 / 投影文件清单）
      description: |
        **v1.6.0 新增（A-6）**。实现 `catalog()` @ `src/kert/api/server.py:622-633`；
        投影清单由 `version_dir.rglob("*.parquet")` 机械列举（排序后）。
      operationId: getCatalog
      responses:
        "200":
          description: 服务目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "422":
          description: 无活动投影（`ServiceNotReadyError`）→ `_handle()`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"

  /api/skill/execute:
    post:
      tags: [Skill]
      summary: 执行 Skill
      description: |
        同步或异步执行指定 Skill。

        - 同步模式（默认）：返回完整执行结果
        - 异步模式（`async: true`）：返回 202 + jobId，通过 `GET /v1/jobs/{jobId}` 轮询结果
      operationId: executeSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillExecuteRequest"
            examples:
              sync_r1:
                summary: R1 同步执行
                value:
                  skillId: R1
                  requestId: req-20260828-001
                  request:
                    customerId: CUST-001
              async_sp20:
                summary: SP-20 异步执行
                value:
                  skillId: SP-20
                  requestId: req-20260828-002
                  async: true
                  request:
                    context:
                      schemaVersion: "1.0.0"
                      customerId: CUST-001
              sp21_sync:
                summary: SP-21 同步执行
                value:
                  skillId: SP-21
                  requestId: req-20260828-003
                  request:
                    context:
                      schemaVersion: "1.0.0"
                      customerId: CUST-001
                      interactionId: INT-001
      responses:
        "200":
          description: 同步执行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillExecuteResponse"
              example:
                requestId: req-20260828-001
                status: ok
                data:
                  skillId: R1
                  reportUrl: /api/skill/report/req-20260828-001
                  result:
                    summary: "客户 CUST-001 画像生成完成"
        "202":
          description: 异步执行已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedResponse"
              example:
                jobId: JOB-SKILL-20260828-001
                status: PENDING
        "422":
          description: |
            请求体校验失败（FastAPI / Pydantic）。**本端点没有 `400` 路径**：
            参数错误一律 422。

            **修正记录（2026-09-16，按实测核对）**：原声明 `400` + `ErrorResponse`
            与实现不符——该路由没有 `try/except`（`skill_execute()` @ `src/kert/api/server.py:647-671`），
            请求体校验由 Pydantic 直接完成并返回 **422**，响应体是 FastAPI 校验体
            `{"detail": [ {type, loc, msg, input}, ... ]}`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                detail:
                  - type: missing
                    loc: ["body", "skillId"]
                    msg: "Field required"
                    input: {}
        "404":
          description: |
            Skill 不存在。响应体与 200 **同构**（`status=skill_error`、
            `errors[0].code=UNKNOWN_SKILL`），而**不是** `ErrorResponse`。

            **修正记录（2026-09-16，按实现核对）**：原声明为 `ErrorResponse` 并给
            `SKILL_NOT_FOUND` 示例，与实现不符；实现（`skill_execute() 的 404 段 @ `src/kert/api/server.py:663-671`）把
            同步结果体原样以 404 返回。GITS 调用方已按真实行为编码
            （`DshHttpSkillExecutionAdapter.java:32`），故按实现修正合同。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillExecuteErrorResponse"
              example:
                requestId: req-20260828-001
                status: skill_error
                data:
                  reportUrl: /api/skill/report/req-20260828-001
                errors:
                  - code: UNKNOWN_SKILL
                    message: "未知 skillId: UNKNOWN"
                assemblyTrace:
                  - phase: resolve
                    status: ok
                    message: "skillId=UNKNOWN requestId=req-20260828-001"
                  - phase: resolve
                    status: failed
                    message: "未知 skillId"
                modelCalls: []
        "500":
          description: |
            服务内部错误。响应体为 `ErrorResponse` 信封
            （`requestId` / `status=skill_error` / `errors[]`），错误码 `INTERNAL_ERROR`，
            消息为**通用**文案（不回显异常内容）。

            **修正记录（2026-09-16，双向对齐）**：本节声明原本就是 `ErrorResponse`，
            但实现此前落到 FastAPI 默认 500（**纯文本** `Internal Server Error`）⇒ 声明失实。
            已按"合同为准"在实现侧补齐 app 级未捕获异常处理器
            （`src/kert/api/server.py` 的 `_unhandled_exception`），
            使实际响应与本节一致（对应失实项 F4c）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                requestId: req-20260828-001
                status: skill_error
                errors:
                  - code: INTERNAL_ERROR
                    message: "内部错误"

