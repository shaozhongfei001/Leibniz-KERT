            statements: {type: array, items: {type: object, additionalProperties: true}}
            statement_count: {type: integer, minimum: 0}
        errors: {type: array, items: {type: object, additionalProperties: true}}
        meta: {type: object, additionalProperties: true, description: 含 `entity_id`（`services.py:108`）}

    DataQueryRequest:
