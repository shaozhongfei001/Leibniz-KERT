openapi: 3.0.3
info:
  title: KERT Skill Execution API
  description: |
    独立知识工程服务端 (KERT) API 规范。

    - v1.3 基线：单客户技能执行、健康检查、报告查看
    - v1.4 增量：SP-20 服务建议书（异步）、SP-21 交互记忆抽取、闸门协作端点
    - v1.5 增量：知识路由与激活计划（知识地图注册查询 / 路由裁决 / 可重放计划），**纯新增**
    - v1.5 修正：`assemblyTrace` 类型 `object` → `array`（合同长期与实现不符，已改正）
    - v1.5 修正（**2026-09-16，按实现核对**；由冲突 C-20 的归并候选分析发现，
      `evidence/m7-3/CANDIDATE-CONTRACT-MERGE-V1-V2.md` §2.5 的 F1/F3/F4/F5）：
      ① `JobStatusResponse` 扁平对象 → **标准信封**，新增 `JobStatusData`（`job_id` 等 snake_case 键）；
      ② `GateListResponse.gates[]` 的 `GateChecklistItem` → 新增 `GateDefinition`（资产形状）；
      ③ `GateAuditResponse` 去掉实现不存在的 `timestamp`/`auditPath`，改为回显真实记录；
      ④ `/api/skill/execute` 的 `404`：`ErrorResponse` → 新增 `SkillExecuteErrorResponse`（与 200 同构）；
      ⑤ `/v1/jobs/{jobId}` 的 `404`：`ErrorResponse` → 新增 `InfrastructureErrorResponse`。
      以上均为**按已运行实现**修正（未改实现、未改 `src/**`）。
      **须通知 GITS**：`data.status` 与 `data.skill_result` 的嵌套位置**保持不变**（GITS `DshJobPoller` 按此读取）。
      机械核对用例：`tests/integration/test_contract_shape_conformance.py`。
      仍待后续批次（本轮未做）：`/api/skill/execute` 的 `400`/`500` 声明、
      `/api/skill/report` 的 404 体、`/v1/knowledge-maps` 的 `422`/`500` 体均未按实测核对；
      `OpenAPI` 方言（3.0.3 vs 校验器要求的 3.1.0）与 8 处 `nullable` 亦未处理（归并 P2 验收条件）。
      另记一条**观察（不在本合同范围、本批不修）**：`_handle()` 对**非** `KERTException`
      的兜底分支会把 `str(exc)` 放进 `detail.error.message`（`src/kert/api/server.py:308-316`），
      与新增的未捕获异常处理器（只给通用 `INTERNAL_ERROR`）**口径不一致**，存在内部信息外泄面；
      列为后续议题（需另立批次，涉及 `_handle()` 全量调用点的行为变更）。
    - **v1.5.1 补丁（2026-09-16，更正性，非语义增量）**：
      Contract Owner 于 2026-09-15 追认的对象是 **`1.5.0` 的 additive 增量**
      （`docs/governance/KERT_PENDING_OWNER_DECISION_M7_EVOLUTION_V1.0.md` §0.1）；
      其后本文件被更正两次（`assemblyTrace` 类型：commit `62b967a`；形状更正：commit `f7749af`）
      ⇒ 同一版本号承载了两份内容，会让"追认"失去确切对象。故 bump 至 `1.5.1`：
      **追认覆盖 v1.5 的 additive 增量，本补丁为形状/错误响应更正**，不含新增能力。
      本补丁内容：① `/api/skill/execute` 的 `400`（**实测不可达**）→ `422` + `ValidationErrorResponse`；
      ② `/api/skill/report/{requestId}` 的 `404` 如实化（新增 `StringDetailErrorResponse`）；
      ③ `/v1/knowledge-maps` 的 `422`/`500` 如实化；
      ④ 新增 app 级异常处理器，使**未捕获异常**返回本合同声明的 `ErrorResponse` 信封（F4c，实现侧改动）；
      ⑤ `SkillHealthResponse` / `SkillBriefInfo` 按实测补齐 `service` 与 `skills[].version`（F7）。
      另：`/v1/*` 下 **9 条已实现但未登记**的路径属 **additive 扩展**（非形状更正），
      不并入本补丁，另出提案待 Contract Owner 追认：
      `evidence/m7-3/PROPOSAL_REGISTER_UNDECLARED_V1_PATHS.md`。

    权威契约：`docs/skill-execute-api-contract-v1.4.md`
    v1.5 变更说明：`evidence/m7-3/CONTRACT_CHANGE_PROPOSAL_ROUTING_API.md`
    **追认：Contract Owner 于 2026-09-15 批准**（含上述 assemblyTrace 类型修正）；
    登记：`docs/governance/KERT_PENDING_OWNER_DECISION_M7_EVOLUTION_V1.0.md` §0.1
    本文档为**运行中权威**（服务实际实现）；v2 候选未批准，归并列 W8/Phase 0 收口（冲突 C-20）
  version: "1.5.1"
  contact:
    name: KERT Team
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:8106
    description: 本地开发（默认 DSH_BASE_URL）

tags:
  - name: Health
    description: 健康检查与探针
  - name: Skill
    description: Skill 执行与查询
  - name: Job
    description: 异步作业管理
  - name: Gate
    description: 闸门协作
  - name: Observability
    description: 可观测性
  - name: Routing
    description: 知识路由与激活计划

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: 服务健康检查
      description: 返回 KERT 服务整体健康状态和已注册技能清单
      operationId: getHealth
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                timestamp: "2026-08-28T10:00:00Z"
                skills:
                  - skillId: R1
                    name: 对公客户画像
                    version: "1.0.0"
                  - skillId: SP-20
                    name: 对公客户服务建议书生成
                    version: "1.0.0"
                  - skillId: SP-21
                    name: 交互记忆抽取
                    version: "1.0.0"
                  - skillId: SP-15
                    name: 产品适配与综合方案
                    version: "2.0.0-candidate"

  /api/skill/health:
    get:
      tags: [Skill, Health]
      summary: Skill 子系统健康检查
      description: GITS 适配器使用的 Skill 健康检查端点，返回已注册技能清单
      operationId: getSkillHealth
      responses:
        "200":
          description: Skill 子系统健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillHealthResponse"
              example:
                status: ok
                service: customer-engagement
                skills:
                  - skillId: R1
                    name: 对公客户画像
                    version: "1.0.0"
                  - skillId: SP-20
                    name: 对公客户服务建议书生成
                    version: "1.0.0"
                  - skillId: SP-21
                    name: 交互记忆抽取
                    version: "1.0.0"

  /v1/skills:
    get:
      tags: [Skill]
      summary: 列出可用 Skill
      description: 返回所有已注册 Skill 的详细信息，包括参数定义和闸门要求
      operationId: listSkills
      responses:
        "200":
          description: Skill 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
              example:
                skills:
                  - skillId: R1
                    name: 对公客户画像
                    description: 基于知识图谱生成对公客户 360 度画像
                    version: "1.0.0"
                    parameters:
                      - name: customerId
                        type: string
                        required: true
                        description: 客户 ID
                  - skillId: SP-20
                    name: 对公客户服务建议书生成
                    description: 生成对公客户服务建议书（含事实标签、双版本、闸门检查）
                    version: "1.0.0"
                    async: true
                    parameters:
                      - name: context
                        type: object
                        required: true
                        description: ContextPackage（含 customerId、schemaVersion 等）

  /api/skill/execute:
    post:
      tags: [Skill]
      summary: 执行 Skill
      description: |
        同步或异步执行指定 Skill。

        - 同步模式（默认）：返回完整执行结果
        - 异步模式（`async: true`）：返回 202 + jobId，通过 `GET /v1/jobs/{jobId}` 轮询结果
      operationId: executeSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillExecuteRequest"
            examples:
              sync_r1:
                summary: R1 同步执行
                value:
                  skillId: R1
                  requestId: req-20260828-001
                  request:
                    customerId: CUST-001
              async_sp20:
                summary: SP-20 异步执行
                value:
                  skillId: SP-20
                  requestId: req-20260828-002
                  async: true
                  request:
                    context:
                      schemaVersion: "1.0.0"
                      customerId: CUST-001
              sp21_sync:
                summary: SP-21 同步执行
                value:
                  skillId: SP-21
                  requestId: req-20260828-003
                  request:
                    context:
                      schemaVersion: "1.0.0"
                      customerId: CUST-001
                      interactionId: INT-001
      responses:
        "200":
          description: 同步执行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillExecuteResponse"
              example:
                requestId: req-20260828-001
                status: ok
                data:
                  skillId: R1
                  reportUrl: /api/skill/report/req-20260828-001
                  result:
                    summary: "客户 CUST-001 画像生成完成"
        "202":
          description: 异步执行已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedResponse"
              example:
                jobId: JOB-SKILL-20260828-001
                status: PENDING
        "422":
          description: |
            请求体校验失败（FastAPI / Pydantic）。**本端点没有 `400` 路径**：
            参数错误一律 422。

            **修正记录（2026-09-16，按实测核对）**：原声明 `400` + `ErrorResponse`
            与实现不符——该路由没有 `try/except`（`src/kert/api/server.py:619-643`），
            请求体校验由 Pydantic 直接完成并返回 **422**，响应体是 FastAPI 校验体
            `{"detail": [ {type, loc, msg, input}, ... ]}`。

            **修正记录（2026-09-16，按实测核对）**：原声明 `400` + `ErrorResponse`
            与实现不符——该路由没有 `try/except`（`src/kert/api/server.py:619-643`），
            请求体校验由 Pydantic 直接完成并返回 **422**，响应体是 FastAPI 校验体
            `{"detail": [ {type, loc, msg, input}, ... ]}`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                detail:
                  - type: missing
                    loc: ["body", "skillId"]
                    msg: "Field required"
                    input: {}
        "404":
          description: |
            Skill 不存在。响应体与 200 **同构**（`status=skill_error`、
            `errors[0].code=UNKNOWN_SKILL`），而**不是** `ErrorResponse`。

            **修正记录（2026-09-16，按实现核对）**：原声明为 `ErrorResponse` 并给
            `SKILL_NOT_FOUND` 示例，与实现不符；实现（`src/kert/api/server.py:635-643`）把
            同步结果体原样以 404 返回。GITS 调用方已按真实行为编码
            （`DshHttpSkillExecutionAdapter.java:32`），故按实现修正合同。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillExecuteErrorResponse"
              example:
                requestId: req-20260828-001
                status: skill_error
                data:
                  reportUrl: /api/skill/report/req-20260828-001
                errors:
                  - code: UNKNOWN_SKILL
                    message: "未知 skillId: UNKNOWN"
                assemblyTrace:
                  - phase: resolve
                    status: ok
                    message: "skillId=UNKNOWN requestId=req-20260828-001"
                  - phase: resolve
                    status: failed
                    message: "未知 skillId"
                modelCalls: []
        "500":
          description: |
            服务内部错误。响应体为 `ErrorResponse` 信封
            （`requestId` / `status=skill_error` / `errors[]`），错误码 `INTERNAL_ERROR`，
            消息为**通用**文案（不回显异常内容）。

            **修正记录（2026-09-16，双向对齐）**：本节声明原本就是 `ErrorResponse`，
            但实现此前落到 FastAPI 默认 500（**纯文本** `Internal Server Error`）⇒ 声明失实。
            已按"合同为准"在实现侧补齐 app 级未捕获异常处理器
            （`src/kert/api/server.py` 的 `_unhandled_exception`），
            使实际响应与本节一致（对应失实项 F4c）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                requestId: req-20260828-001
                status: skill_error
                errors:
                  - code: INTERNAL_ERROR
                    message: "内部错误"

  /api/skill/report/{requestId}:
    get:
      tags: [Skill]
      summary: 获取 Skill 执行报告
      description: 根据 requestId 获取 Skill 执行后的报告内容
      operationId: getSkillReport
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: Skill 执行请求 ID
      responses:
        "200":
          description: 报告内容
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                type: object
        "404":
          description: |
            报告不存在或已过期（执行结果仅缓存约 10 分钟）。
            响应体是 `{"detail": "<字符串>"}`（实现以 `HTTPException(detail=str)` 抛出，
            `src/kert/api/server.py:653-657`），**不是** `ErrorResponse`。

            **修正记录（2026-09-16，按实测核对）**：原声明未给响应体，实测为字符串 `detail`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringDetailErrorResponse"
              example:
                detail: "报告不存在或已过期（执行结果仅缓存 10 分钟，请重新执行）"

  /api/skill/gates/{customerId}:
    get:
      tags: [Gate]
      summary: 获取客户闸门清单
      description: |
        返回指定客户的 GATE-BIZ-G0..G5 清单资产（must/forbidden）。
        GITS 用此渲染闸门页面。
      operationId: getGates
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          description: 客户 ID
      responses:
        "200":
          description: 闸门清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateListResponse"
              example:
                customerId: CUST-001
                gates:
                  - gateId: GATE-BIZ-G0
                    name: G0
                    sequence: 0
                    must:
                      - "证据与客户数据就绪（ContextPackage 完整、无关键 unknown）"
                    forbidden:
                      - "编造数据 / 无来源断言进入建议书"
                    assetPath: skills/service-proposal/gates/GATE-BIZ-G0.md
                  - gateId: GATE-BIZ-G1
                    name: G1
                    sequence: 1
                    must:
                      - "客户核验完成（F 标签断言与客户确认一致）"
                    forbidden:
                      - "未核验数据进入对客版"
                    assetPath: skills/service-proposal/gates/GATE-BIZ-G1.md
        "404":
          description: 客户无闸门资产

  /api/skill/gates/audit:
    post:
      tags: [Gate]
      summary: 闸门决策镜像
      description: |
        业务闸门决策**镜像**（非权威）。权威状态机在 GITS。
        KERT 仅追加记录到 `90_control/audit/gates.jsonl`。
      operationId: auditGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateAuditRequest"
            example:
              customerId: CUST-001
              gate: G1
              decision: PASSED
              decidedBy: user-zhangsan
              reason: "所有事实标签已标注完成"
      responses:
        "200":
          description: 镜像记录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateAuditResponse"
              example:
                recorded: true
                customerId: CUST-001
                gate: G1
                decision: PASSED
                decidedBy: user-zhangsan
                reason: "所有事实标签已标注完成"
                recordedAt: "2026-08-28T10:30:00Z"

  /v1/jobs/{jobId}:
    get:
      tags: [Job]
      summary: 查询异步 Job 状态
      description: |
        查询异步 Skill 执行 Job 的状态。
        响应为**标准信封**（`request_id`/`status`/`data`/`errors`/`meta`），
        Job 记录在 `data` 内（键为 snake_case；`data.status` 为业务状态）。
        COMPLETED 时 `data.skill_result` 为完整 execute 响应（与同步响应同构）。

        **修正记录（2026-09-16，按实现核对）**：本端点的 200 响应原声明为**扁平对象**
        （顶层 `jobId`/`status`/`createdAt`/`completedAt`），404 原声明为 `ErrorResponse`；
        两者均与实现不符，已按实现修正（见 `JobStatusResponse`/`JobStatusData`/
        `InfrastructureErrorResponse` 三个 schema 的修正记录）。

        ⚠ **须通知 GITS（其调用方口径）**：GITS `DshJobPoller` 读取 `data.status`（强制非空）
        与 `data.skill_result`；本次修正**保持**该嵌套位置不变，仅更正键名与信封形状。
        机械核对用例：`tests/integration/test_contract_shape_conformance.py`。
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: 异步作业 ID（格式 JOB-SKILL-YYYYMMDD-NNN）
      responses:
        "200":
          description: Job 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
              examples:
                pending:
                  summary: 等待中（无 skill_result）
                  value:
                    request_id: REQ-JOB-JOB-SKILL-20260828-001
                    status: OK
                    data:
                      schema: job_status/v1
                      job_id: JOB-SKILL-20260828-001
                      job_type: SKILL
                      status: PENDING
                      requested_by: api
                      idempotency_key: req-20260828-002
                      input_refs: []
                      output_refs: []
                      started_at: "2026-08-28T10:00:00Z"
                      updated_at: "2026-08-28T10:00:00Z"
                      finished_at: null
                      progress: 0
                      error_code: null
                      error_message: null
                      publish_status: NOT_PUBLISHED
                      version: "1.0"
                    errors: []
                    meta:
                      service_version: "1.0.0"
                      data_version: active
                      generated_at: "2026-08-28T10:00:00Z"
                running:
                  summary: 执行中（无 skill_result）
                  value:
                    request_id: REQ-JOB-JOB-SKILL-20260828-001
                    status: OK
                    data:
                      schema: job_status/v1
                      job_id: JOB-SKILL-20260828-001
                      job_type: SKILL
                      status: RUNNING
                      requested_by: api
                      idempotency_key: req-20260828-002
                      input_refs: []
                      output_refs: []
                      started_at: "2026-08-28T10:00:01Z"
                      updated_at: "2026-08-28T10:00:01Z"
                      finished_at: null
                      progress: 40
                      error_code: null
                      error_message: null
                      publish_status: NOT_PUBLISHED
                      version: "1.0"
                    errors: []
                    meta:
                      service_version: "1.0.0"
                      data_version: active
                      generated_at: "2026-08-28T10:00:01Z"
                completed:
                  summary: 已完成（含 skill_result）
                  value:
                    request_id: REQ-JOB-JOB-SKILL-20260901-001
                    status: OK
                    data:
                      schema: job_status/v1
                      job_id: JOB-SKILL-20260901-001
                      job_type: SKILL
                      status: COMPLETED
                      requested_by: api
                      idempotency_key: REQ-SP20-506dc772-2380-417a-860b-0cd25c37a04d
                      input_refs: []
                      output_refs: []
                      started_at: "2026-09-01T18:01:42Z"
                      updated_at: "2026-09-01T18:02:29Z"
                      finished_at: "2026-09-01T18:02:29Z"
                      progress: 100
                      error_code: null
                      error_message: null
                      publish_status: NOT_PUBLISHED
                      version: "1.0"
                      skill_result:
                        requestId: REQ-SP20-506dc772-2380-417a-860b-0cd25c37a04d
                        status: ok
                        data:
                          skillId: SP-20
                          reportUrl: /api/skill/report/REQ-SP20-506dc772-2380-417a-860b-0cd25c37a04d
                    errors: []
                    meta:
                      service_version: "1.0.0"
                      data_version: active
                      generated_at: "2026-09-01T18:02:29Z"
                failed:
                  summary: 执行失败（错误码在 data 内，无顶层 error）
                  value:
