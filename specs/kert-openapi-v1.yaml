  /v1/knowledge-maps:
    get:
      tags: [Routing]
      summary: 列出已注册的知识地图
      description: |
        返回本工作区 `90_control/catalog/KM-*.json` 注册的知识地图摘要，以及当前路由策略的版本。
        控制面未注册任何地图时返回**空列表**（不报错）；此时路由裁决会**默认拒绝**。
      operationId: listKnowledgeMaps
      responses:
        "200":
          description: 知识地图列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeMapListResponse"
        "422":
          description: |
            控制面地图定义非法（`KERTException` ⇒ `_handle()` 转
            `HTTPException(detail={"error": ...})`，FastAPI 序列化为 `{"detail": ...}`）。

            **修正记录（2026-09-16，按实测核对）**：原声明未给响应体。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"
              example:
                detail:
                  error:
                    code: SCHEMA_VALIDATION_FAILED
                    message: "知识地图定义非法"
                    retryable: false
        "500":
          description: |
            内部错误。**两种形状均可能**（故用 `oneOf`）：
            ① 领域异常经 `_handle()` ⇒ `{"detail":{"error":{...}}}`（`InfrastructureErrorResponse`）；
            ② 未捕获异常经 app 级处理器 ⇒ `ErrorResponse` 信封。

            **修正记录（2026-09-16，按实测核对）**：原声明未给响应体；实测两形状并存。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InfrastructureErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              example:
                detail:
                  error:
                    code: INTERNAL_ERROR
                    message: "内部错误"
                    retryable: true

