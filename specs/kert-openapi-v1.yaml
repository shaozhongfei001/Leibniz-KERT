        "422":
          description: 地图定义非法
        "500":
          description: 内部错误

  /v1/routing/plan:
    post:
      tags: [Routing]
      summary: 解析任务并产出激活计划（fail-closed）
      description: |
        按路由策略把 `taskType` 解析为**唯一**知识地图，并产出**可重放**的激活计划
        （资产 / Skill / 版本快照 / planHash）。

        **拒绝是预期业务结果**（策略缺失、任务未映射、同优先级歧义、地图未注册、策略错配、
        本体引用缺失或非法），此时返回 **HTTP 200** 且 `data.allowed=false` + `data.denial`。
        `allowed` 只可能是 `true`（带 `plan`）或 `false`（带 `denial`）——**没有第三态**。
      operationId: buildRoutingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingPlanRequest"
      responses:
        "200":
          description: 计划或**显式拒绝**（两者都是 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingPlanResponse"
        "422":
          description: 输入或控制面定义非法（schema 校验失败）
        "500":
          description: 内部错误

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key 认证（演示环境可省略）
  schemas:
    HealthResponse:
      type: object
      description: |-
        `GET /v1/health` 的 200 响应（`_response()` 信封；实现：`health()` @ `src/kert/api/server.py:483-501`）。

        **修正记录（2026-09-17，更正性，按实测；D-42）**：原声明为**扁平**对象
        `required: [status, timestamp, skills]`、`status` 小写 `[ok, degraded]` —— 与实现**形状不同**：
        实现返回**标准信封**（`request_id`/`status`/`data`/`errors`/`meta`），健康数据在 `data` 下，
        且 `data.status` 为**大写** `OK|DEGRADED`，键为 `service_version`/`data_version`/`runtime`
        （**无** `timestamp`/`skills`）。⇒ 本次按**已运行实现**更正（不改实现、不改 `src/**`、不改状态码）。
        技能清单在 `SkillHealthResponse`（`/api/skill/health`）。**须通知 GITS**（若其按旧声明读该端点）。
      required: [request_id, status, data, errors, meta]
      additionalProperties: false
      properties:
        request_id: {type: string}
        status: {type: string, enum: [OK], description: 信封状态（实现恒为 `OK`，与 `data.status` 不同义）}
        data:
          type: object
          required: [status, service_version, data_version, runtime]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [OK, DEGRADED]
              description: 服务整体状态；`DEGRADED` = `_active_version()` 抛 `ServiceNotReadyError`
            service_version: {type: string}
            data_version: {type: string, nullable: true, description: 活跃数据版本；未就绪时为 null}
            runtime:
              type: object
              description: 运行时配置快照（实现为**字面量字典** ⇒ 闭集，无条件增删分支）
              required: [profile, auth_enabled, rate_limit_enabled, size_limit_enabled,
                         concurrency_enabled, runtime_store_enabled, schema_version, warnings]
              additionalProperties: false
              properties:
                profile: {type: string}
                auth_enabled: {type: boolean}
                rate_limit_enabled: {type: boolean}
                size_limit_enabled: {type: boolean}
                concurrency_enabled: {type: boolean}
                runtime_store_enabled: {type: boolean}
                schema_version: {type: integer, nullable: true, description: 未启用运行态持久化时为 null}
                warnings: {type: array, items: {type: string}}
        errors: {type: array, items: {type: object, additionalProperties: true}}
        meta: {type: object, additionalProperties: true}

    SkillHealthResponse:
      type: object
      description: |
        Skill 子系统健康（`GET /api/skill/health`，GITS 适配器使用）。

        **修正记录（2026-09-16，按实测核对；F7）**：原声明只有 `status`/`skills`，
        而实现**恒返回 `service`**（`skill_health()` @ `src/kert/api/server.py:637-645` 的字典字面量：
        `{"status", "service", "skills"}`）⇒ 声明不完整。按实测补 `service`（必填）。

        **闭集论证**（`additionalProperties: false` 的依据）：实现返回的是**字面量字典**、
        仅上述 3 键（`skill_health()` @ `src/kert/api/server.py:637-645`），不存在条件增删分支 ⇒ 响应确为闭集。
        ⚠ 附注：`service` 目前**写死** `customer-engagement`（`skill_health()` 的 `service` 行 @ `src/kert/api/server.py:642`），
        与冲突 `C-14`（"产品中立"）同源；是否改为配置化由 Contract Owner 决策。
      required: [status, service, skills]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          description: 服务标识（实现当前写死 `customer-engagement`；见 C-14）
          example: customer-engagement
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillBriefInfo"

