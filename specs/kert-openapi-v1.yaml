    # ── v1.6.0 / A-6 新增：9 条路径的请求与响应 schema ──
    # 约定（与实现逐字段对齐，不凭记忆）：
    #   · 请求模型**不声明** `additionalProperties: false` —— 实现用 pydantic `BaseModel`，
    #     默认**不拒绝**未知字段（唯一例外是 `RoutingPlanRequest`，其自带 `extra="forbid"`）；
    #     在此声明"闭集"会与实现不符。
    #   · 响应侧：凡经 `_response()`（`src/kert/api/server.py:208-217`）者，
    #     恒含 `request_id`/`status`/`data`/`errors`/`meta` **五个键** ⇒ 一律全部声明。
    #   · 仅当"键集合确为闭集"（无条件分支）时才写 `additionalProperties: false`；
    #     含条件键者（`graph.paths` / `evidence.blocker`）改为**开集 + 显式声明全部可能键**，
    #     理由写在各自 description（不得把条件键塞进 `required` 造假闭集）。
    #   · 叶级 schema 采用 flow 风格（`{type: string}`）以控制文件体积；结构化层级仍用块风格。

    ExtractionRequest:
      type: object
      description: |
        `POST /v1/extractions` 请求体（实现 `ExtractionRequest` @ `src/kert/api/server.py:151-158`）。
      required: [request_id, idempotency_key, domain, input]
      properties:
        request_id: {type: string}
        idempotency_key: {type: string}
        domain: {type: string}
        input:
          type: object
          additionalProperties: true
          description: 抽取输入。实现取 `input.path` 并从其中的 `batch=<ID>` 解析批次号（`server.py:507-513`）
        extraction_types:
          type: array
          items: {type: string}
          default: [ENTITY, RELATION, STATEMENT, RULE]
        schema_versions:
          type: array
          items: {type: string}
          nullable: true
        options: {type: object, additionalProperties: true}

    ExtractionsAcceptedResponse:
      type: object
      description: |
        `POST /v1/extractions` 的 **202** 响应。
        ⚠ 实现**手写信封**（`extract()` @ `src/kert/api/server.py:516-526`），
        `status` 恒为 **`ACCEPTED`**（与其余 `/v1/*` 端点的 `OK` **不同义**）。
      required: [request_id, status, data, errors, meta]
      additionalProperties: false
      properties:
        request_id: {type: string}
        status: {type: string, enum: [ACCEPTED]}
        data:
          type: object
          required: [job_id, result_status, publish_status]
          additionalProperties: false
          properties:
            job_id: {type: string}
            result_status: {type: string, example: CANDIDATE}
            publish_status: {type: string, example: NOT_PUBLISHED}
        errors: {type: array, items: {type: object, additionalProperties: true}}
        meta:
          type: object
          additionalProperties: true
          description: 实现给定 `service_version` / `data_version` / `generated_at`（`server.py:523-525`）

    ExtractionResultResponse:
      type: object
      description: |
        `GET /v1/extractions/{job_id}/result` 的 200 响应（`_response()`，
        `extraction_result()` @ `src/kert/api/server.py:538-548`）。
        `data.status` 取自 Job 状态记录，与信封 `status` **不同义**。
      required: [request_id, status, data, errors, meta]
      additionalProperties: false
      properties:
        request_id: {type: string}
        status: {type: string, enum: [OK], description: 信封状态（实现恒为 `OK`；v1.6.2 起为闭集登记）}
        data:
          type: object
          required: [job_id, status, publish_status, output_refs]
          additionalProperties: false
          properties:
            job_id: {type: string}
            status: {type: string, nullable: true}
            publish_status: {type: string, nullable: true}
            output_refs: {type: array, items: {type: object, additionalProperties: true}}
        errors: {type: array, items: {type: object, additionalProperties: true}}
        meta: {type: object, additionalProperties: true}

    EntityResponse:
      type: object
      description: |
        `GET /v1/entities/{entity_id}` 的 200 响应（`_response()`）。
        数据由 `KnowledgeService.get_entity` 给出（`src/kert/application/services.py:96-109`）。
