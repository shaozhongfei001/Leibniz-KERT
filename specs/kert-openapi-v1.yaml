      summary: 获取单张知识地图
      operationId: getKnowledgeMap
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: string
          description: "知识地图 ID（形如 KM-CORP-RM-PREVISIT）"
      responses:
