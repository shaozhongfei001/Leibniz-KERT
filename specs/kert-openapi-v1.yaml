                      job_type: SKILL
                      status: FAILED
                      requested_by: api
                      idempotency_key: req-20260828-002
                      input_refs: []
                      output_refs: []
                      started_at: "2026-08-28T10:00:00Z"
                      updated_at: "2026-08-28T10:00:30Z"
                      finished_at: "2026-08-28T10:00:30Z"
                      progress: 0
                      error_code: SKILL_EXECUTION_ERROR
                      error_message: "Context package validation failed"
                      publish_status: NOT_PUBLISHED
                      version: "1.0"
                    errors: []
                    meta:
                      service_version: "1.0.0"
                      data_version: active
                      generated_at: "2026-08-28T10:00:30Z"
        "404":
          description: |
            Job 不存在（`ASSET_NOT_FOUND`）。响应体为领域异常形状
            （`{"detail":{"error":{...}}}`），**不是** `ErrorResponse`。

            **修正记录（2026-09-16，按实现核对）**：原声明为 `ErrorResponse`，实测不符
            （`read_job_status` 抛 `AssetNotFoundError` → `_handle()` → FastAPI 包一层 `detail`）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"
              example:
                detail:
                  error:
                    code: ASSET_NOT_FOUND
                    message: "任务不存在: JOB-NOT-EXIST"
                    retryable: false

  /livez:
    get:
      tags: [Health]
      summary: 存活探针
      description: Kubernetes 存活探针，进程存活即返回 200
      operationId: livez
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: 就绪探针
      description: Kubernetes 就绪探针，服务可接受请求时返回 200
      operationId: readyz
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: 服务未就绪

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus 指标
      description: 返回 Prometheus 格式的指标数据
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus 指标
          content:
            text/plain:
              schema:
                type: string

  /v1/knowledge-maps:
    get:
      tags: [Routing]
      summary: 列出已注册的知识地图
      description: |
        返回本工作区 `90_control/catalog/KM-*.json` 注册的知识地图摘要，以及当前路由策略的版本。
        控制面未注册任何地图时返回**空列表**（不报错）；此时路由裁决会**默认拒绝**。
      operationId: listKnowledgeMaps
      responses:
        "200":
          description: 知识地图列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeMapListResponse"
        "422":
          description: |
            控制面地图定义非法（`KERTException` ⇒ `_handle()` 转
            `HTTPException(detail={"error": ...})`，FastAPI 序列化为 `{"detail": ...}`）。

            **修正记录（2026-09-16，按实测核对）**：原声明未给响应体。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureErrorResponse"
              example:
                detail:
                  error:
                    code: SCHEMA_VALIDATION_FAILED
                    message: "知识地图定义非法"
                    retryable: false
        "500":
          description: |
            内部错误。**两种形状均可能**（故用 `oneOf`）：
            ① 领域异常经 `_handle()` ⇒ `{"detail":{"error":{...}}}`（`InfrastructureErrorResponse`）；
            ② 未捕获异常经 app 级处理器 ⇒ `ErrorResponse` 信封。

            **修正记录（2026-09-16，按实测核对）**：原声明未给响应体；实测两形状并存。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InfrastructureErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              example:
                detail:
                  error:
                    code: INTERNAL_ERROR
                    message: "内部错误"
                    retryable: true

  /v1/knowledge-maps/{mapId}:
    get:
      tags: [Routing]
      summary: 获取单张知识地图
      operationId: getKnowledgeMap
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: string
          description: "知识地图 ID（形如 KM-CORP-RM-PREVISIT）"
      responses:
        "200":
          description: 地图详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeMapDetail"
        "404":
          description: 地图未注册（协议级资源不存在）
        "422":
          description: 地图定义非法
        "500":
          description: 内部错误

  /v1/routing/plan:
    post:
      tags: [Routing]
      summary: 解析任务并产出激活计划（fail-closed）
      description: |
        按路由策略把 `taskType` 解析为**唯一**知识地图，并产出**可重放**的激活计划
        （资产 / Skill / 版本快照 / planHash）。

        **拒绝是预期业务结果**（策略缺失、任务未映射、同优先级歧义、地图未注册、策略错配、
        本体引用缺失或非法），此时返回 **HTTP 200** 且 `data.allowed=false` + `data.denial`。
        `allowed` 只可能是 `true`（带 `plan`）或 `false`（带 `denial`）——**没有第三态**。
      operationId: buildRoutingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingPlanRequest"
      responses:
        "200":
          description: 计划或**显式拒绝**（两者都是 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingPlanResponse"
        "422":
          description: 输入或控制面定义非法（schema 校验失败）
        "500":
          description: 内部错误

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key 认证（演示环境可省略）
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp, skills]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillInfo"

    SkillHealthResponse:
      type: object
      description: |
        Skill 子系统健康（`GET /api/skill/health`，GITS 适配器使用）。

        **修正记录（2026-09-16，按实测核对；F7）**：原声明只有 `status`/`skills`，
        而实现**恒返回 `service`**（`src/kert/api/server.py:612-617` 的字典字面量：
        `{"status", "service", "skills"}`）⇒ 声明不完整。按实测补 `service`（必填）。

        **闭集论证**（`additionalProperties: false` 的依据）：实现返回的是**字面量字典**、
        仅上述 3 键（`server.py:612-617`），不存在条件增删分支 ⇒ 响应确为闭集。
        ⚠ 附注：`service` 目前**写死** `customer-engagement`（`server.py:614`），
        与冲突 `C-14`（"产品中立"）同源；是否改为配置化由 Contract Owner 决策。
      required: [status, service, skills]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          description: 服务标识（实现当前写死 `customer-engagement`；见 C-14）
          example: customer-engagement
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillBriefInfo"

    SkillInfo:
      type: object
      required: [skillId, name]
      properties:
        skillId:
          type: string
          description: Skill 唯一标识
        name:
          type: string
          description: Skill 显示名称
        version:
          type: string
          description: Skill 版本
        description:
          type: string
        async:
          type: boolean
          description: 是否支持异步执行
          default: false
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/SkillParameter"

    SkillBriefInfo:
      type: object
      description: |
        健康接口的技能摘要。
        **修正记录（2026-09-16，按实测核对；F7）**：补 `version`——实现恒返回
        `{"skillId", "name", "version"}`（`src/kert/api/server.py:615-616`），原声明缺席。
        **闭集论证**：实现为字典字面量、仅上述 3 键、无条件分支 ⇒ 响应确为闭集。
      required: [skillId, name, version]
      additionalProperties: false
      properties:
        skillId:
          type: string
        name:
          type: string
        version:
          type: string
          example: "1.0.0"

    SkillParameter:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, number, boolean, object, array]
        required:
          type: boolean
          default: false
        description:
          type: string
        default:
          description: 参数默认值

    SkillListResponse:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillInfo"

    SkillExecuteRequest:
      type: object
      required: [skillId, requestId, request]
      properties:
        skillId:
          type: string
          description: Skill 唯一标识
          example: R1
        requestId:
          type: string
          description: 请求唯一标识（幂等键）
          example: req-20260828-001
        async:
          type: boolean
          description: 是否异步执行（默认 false）
          default: false
        request:
          $ref: "#/components/schemas/SkillRequestBody"
        context:
          $ref: "#/components/schemas/ContextPackage"
          description: |
            顶层 context（v1.3 兼容）。
            与 request.context 二选一，服务端合并时 request.context 优先。

    SkillRequestBody:
      type: object
      description: |
        Skill 执行请求体。
        - 单客户技能（R1/图谱/外联/会面）：传 `customerId`
        - 组合技能（SP-20/SP-21）：传 `context`（ContextPackage）
      properties:
        customerId:
          type: string
          description: 客户 ID（单客户技能）
          example: CUST-001
        context:
          $ref: "#/components/schemas/ContextPackage"
        structuredFacts:
          type: object
          description: 结构化事实（v1.3 遗留，已忽略）
          deprecated: true
          additionalProperties: true

    ContextPackage:
      type: object
      description: SP-20/SP-21 专用上下文包
      required: [schemaVersion, customerId]
      properties:
        schemaVersion:
          type: string
          example: "1.0.0"
        customerId:
          type: string
          example: CUST-001
        interactionId:
          type: string
          description: 交互 ID（SP-21 必需）
        gateState:
          type: object
          description: 闸门状态（SP-20 使用）
          properties:
            passed:
              type: array
              items:
                type: string
              description: 已通过的闸门列表
              example: ["G0"]
        proposalContext:
          type: object
          description: 建议书上下文（SP-20 使用）
          additionalProperties: true

    SkillExecuteResponse:
      type: object
      required: [requestId, status, data]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [ok, skill_error, exit_policy_no_new_evidence]
        data:
          $ref: "#/components/schemas/SkillExecuteData"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        assemblyTrace:
          type: array
          description: |
            知识装配追踪。**每项**为 ``AssemblyTraceStep``；字段（含 ``phase``/``status``
            词表与 ``kiId``/``errorCode``/``mapId``/``planHash`` 等）的权威定义见
            ``docs/contracts/schemas/assembly-trace.schema.json``，本处不复写。
            修正记录：v1.5 前本字段误写为 ``type: object``，与实现返回的数组不符
            （Contract Owner 于 2026-09-15 批准修正）。
          items:
            type: object
            additionalProperties: true
        modelCalls:
          type: array
          description: 模型调用记录
          items:
            type: object
            additionalProperties: true

    SkillExecuteData:
      type: object
      required: [skillId]
      properties:
        skillId:
          type: string
        reportUrl:
          type: string
          description: 报告 URL
        result:
          description: |
            执行结果。
            - 旧技能：自由结构
            - SP-20：ServiceResult（含 proposalDraft、citations、gateRecommendations 等）
            - SP-21：InteractionMemoryResult（含 candidateMemories、memoryUpdates 等）
          oneOf:
            - $ref: "#/components/schemas/ServiceResult"
            - $ref: "#/components/schemas/InteractionMemoryResult"
            - type: object
              additionalProperties: true
        ruleViolations:
          type: array
          description: 规则校验违规（v1.4 新增）
          items:
            $ref: "#/components/schemas/RuleViolation"

    ServiceResult:
      type: object
      description: SP-20 服务建议书执行结果
      properties:
        schemaVersion:
          type: string
          example: "1.0.0"
        skillId:
          type: string
          example: SP-20
        runId:
          type: string
          example: RUN-PROPOSAL-20260828-001
        status:
          type: string
          enum: [SUCCESS, PARTIAL]
        timestamp:
          type: string
          format: date-time
        content:
          type: object
          properties:
            proposalDraft:
              type: string
              description: 8 章 Markdown 正文
            internalVersion:
              type: object
              properties:
                content:
                  type: string
                factLabels:
                  type: object
                  additionalProperties:
                    type: string
            customerVersion:
              type: object
              properties:
                content:
                  type: string
                filteringNotes:
                  type: array
                  items:
                    type: string
                includes:
                  type: array
                  items:
                    type: string
                excludes:
                  type: array
                  items:
                    type: string
                releaseBlockedUntil:
                  type: array
                  items:
                    type: string
            customerVersionNote:
              type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/Unknown"
        limitations:
          type: array
          items:
            type: string
        gateRecommendations:
          $ref: "#/components/schemas/GateRecommendations"

    InteractionMemoryResult:
      type: object
      description: SP-21 交互记忆抽取结果
      properties:
        schemaVersion:
          type: string
          example: "1.0.0"
        skillId:
          type: string
          example: SP-21
        interactionId:
          type: string
        status:
          type: string
          enum: [SUCCESS, PARTIAL]
        candidateMemories:
          type: array
          items:
            $ref: "#/components/schemas/CandidateMemory"
        memoryUpdates:
          type: array
          items:
            $ref: "#/components/schemas/MemoryUpdate"
        memorySupersessions:
          type: array
          items:
            $ref: "#/components/schemas/MemorySupersession"
        ruleViolations:
          type: array
          items:
            $ref: "#/components/schemas/RuleViolation"

    Citation:
      type: object
      properties:
        id:
          type: string
          example: CIT-0001
        claim:
          type: string
        source:
          type: string
        date:
          type: string
          format: date
        factLabel:
          type: string
          enum: [F, C, B, H, P, A]
          description: "F=事实, C=推论, B=信念, H=假设, P=预测, A=断言"
        chapterRef:
          type: string
          example: CH01

    Unknown:
      type: object
      properties:
        id:
          type: string
          example: UNK-0001
        description:
          type: string
        suggestedAction:
          type: string
        relatedChapter:
          type: string

    CandidateMemory:
      type: object
      properties:
        memoryId:
          type: string
        category:
          type: string
          enum: [PREFERENCE, DECISION_PATTERN, RELATIONSHIP, BUSINESS_SIGNAL, EMOTIONAL_STATE]
        content:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        suggestedDecayRule:
          type: string
          enum: [NONE, LINEAR, STEP]
        evidenceQuote:
          type: string

    MemoryUpdate:
      type: object
      properties:
        memoryId:
          type: string
        action:
          type: string
          enum: [REINFORCE]
        confidenceDelta:
          type: number
          format: float
        reason:
          type: string

    MemorySupersession:
      type: object
      properties:
        memoryId:
          type: string
        supersededBy:
          type: string
        reason:
          type: string

    RuleViolation:
      type: object
      properties:
        ruleId:
          type: string
          description: |
            SP-20 规则：CITATION_REQUIRED, NO_UNDISCLOSED_DEGRADATION, DUAL_VERSION_PRINCIPLE,
            GATE_SEQUENCING, FACT_LABEL_MANDATORY, NO_COMMITMENT_WITHOUT_APPROVAL
            SP-21 规则：CONFIDENCE_CALIBRATION, DECAY_RULE_APPLICATION, DUPLICATE_DETECTION
        severity:
          type: string
          enum: [BLOCKING, WARNING]
        message:
          type: string

    GateRecommendations:
      type: object
      properties:
        currentGate:
          type: string
          example: G1
        passedGates:
          type: array
          items:
            type: string
          example: ["G0"]
        overallReadiness:
          type: string
          enum: [READY, BLOCKED]
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/GateChecklistItem"
        nextGatePrerequisites:
          type: array
          items:
            type: string

    GateChecklistItem:
      type: object
      properties:
        gate:
          type: string
        state:
          type: string
          enum: [PASSED, READY_FOR_REVIEW, BLOCKED, PENDING]
        name:
          type: string
        checklist:
          type: object
          properties:
            must:
              type: array
              items:
                type: string
            forbidden:
              type: array
              items:
                type: string

    AsyncAcceptedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          description: 异步作业 ID
          example: JOB-SKILL-20260828-001
        status:
          type: string
          enum: [PENDING]
          description: 初始状态始终为 PENDING

    JobStatusResponse:
      type: object
      description: |
        标准响应信封（与 `/v1/*` 其余端点一致）；Job 状态记录在 `data` 内。

        **修正记录（2026-09-16，按实现核对）**：本 schema 原声明为**扁平对象**
        （顶层 `jobId`/`createdAt`/`completedAt`，`data` 仅含 `skill_result`），
        与实现长期不符——实现返回 `_response()` 信封（`src/kert/api/server.py:502-508`），
        Job 记录取自 `STATUS.md` front matter（`src/kert/application/jobs.py:236-253`），
        键为 snake_case，`skill_result` 位于 `data` 内（`jobs.py:324-333`）。

        ⚠ **须通知 GITS（其调用方口径）**：GITS `DshJobPoller` 读 `data.status` 与
        `data.skill_result`；本次修正**保持**该嵌套位置不变，仅更正键名与信封形状。
        机械核对：`tests/integration/test_contract_shape_conformance.py`。
      required: [request_id, status, data]
      additionalProperties: false
      properties:
        request_id:
          type: string
        status:
          type: string
          description: 信封状态（实现恒为 `OK`，与 `data.status` 不同义）
        data:
          $ref: "#/components/schemas/JobStatusData"
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    JobStatusData:
      type: object
      description: |
        Job 状态记录（`90_control/jobs/<job_id>/STATUS.md` front matter 的只读投影）。
        字段清单与 `src/kert/application/jobs.py:236-253` 的 `fm` 逐字段一致。

        **修正记录（2026-09-16）**：新增本 schema 以承接原 `JobStatusResponse` 的扁平声明；
        其中 `job_id` 原写作 `jobId`（camelCase），与实现不符，一并修正。
        ⚠ **须通知 GITS**：`skill_result` 的位置保持不变（`data.skill_result`）。
      required: [schema, job_id, job_type, status, progress]
      additionalProperties: false
      properties:
        schema:
          type: string
          enum: [job_status/v1]
        job_id:
          type: string
          description: |
            异步作业 ID（格式 `JOB-SKILL-YYYYMMDD-NNN`）。
            ⚠ 修正记录：原合同写作 `jobId`，实现为 `job_id`（`jobs.py:238`）。
        job_type:
          type: string
          example: SKILL
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
          description: Job 业务状态（与信封 `status` 不同义）
        requested_by:
          type: string
        idempotency_key:
          type: string
        input_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        output_refs:
          type: array
          items:
            type: object
            additionalProperties: true
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type: string
          nullable: true
          description: FAILED 时的错误码（否则为 null）
        error_message:
          type: string
          nullable: true
          description: FAILED 时的错误信息（否则为 null）
        publish_status:
          type: string
          example: NOT_PUBLISHED
        version:
          type: string
        skill_result:
          description: |
            异步 Skill 作业**完成时**附加（`90_control/jobs/<job_id>/result.json`），
            为完整 execute 响应（与同步响应同构）；未完成时**该键不出现**。
            ⚠ **须通知 GITS**：位置保持在 `data` 内，不得上提至顶层（GITS `DshJobPoller:124-126` 按此读取）。
          allOf:
            - $ref: "#/components/schemas/SkillExecuteResponse"

    GateListResponse:
      type: object
      description: |
        闸门清单（`GATE-BIZ-G0..G5` 资产）。

        **修正记录（2026-09-16，按实现核对）**：`gates[]` 原误声明为 `GateChecklistItem`
        （`gate`/`state`/`checklist.must`），而实现返回**资产形状**
        （`gateId`/`name`/`sequence`/`must`/`forbidden`/`assetPath`，
        见 `src/kert/application/service_proposal.py:114-117`）。三者（`gate`/`state`/`checklist`）
        在实现中**不存在**，已改为 `GateDefinition`。
        注意：`GateChecklistItem` 仍被 `GateRecommendations.checklist` 使用（该处与实现相符），故**保留**。
      required: [customerId, gates]
      additionalProperties: false
      properties:
        customerId:
          type: string
        gates:
          type: array
          items:
            $ref: "#/components/schemas/GateDefinition"

    GateDefinition:
      type: object
      description: |
        闸门清单资产条目（`skills/service-proposal/gates/GATE-BIZ-*.md` 的 front matter
        + 正文「必须完成 / 禁止事项」列表抽取）。
        字段与 `src/kert/application/service_proposal.py:114-117` 逐字段一致；
        与 `docs/contracts/schemas/gate.schema.json` 的 `GateDefinition` **同形**
        （该文件为细节 canonical 层，本处保留字段级定义以便单文件自洽）。

        **修正记录（2026-09-16）**：新增。原 `GateListResponse.gates[]` 误引用
        `GateChecklistItem`（`gate`/`state`/`checklist` 三键在实现中不存在）。
      required: [gateId, name, sequence, must, forbidden]
      additionalProperties: false
      properties:
        gateId:
          type: string
          description: 闸门资产 ID（形如 `GATE-BIZ-G0`）
          example: GATE-BIZ-G0
        name:
          type: string
          description: 资产 front matter 的 `name`（当前资产为 `G0`..`G5`）
          example: G0
        sequence:
          type: integer
          description: 推进顺序（当前资产自 `0` 起）
        must:
          type: array
          items:
            type: string
          description: 必须完成项（资产正文「必须完成」）
        forbidden:
          type: array
          items:
            type: string
          description: 禁止事项（资产正文「禁止事项」）
        assetPath:
          type: string
          description: 资产相对路径
          example: skills/service-proposal/gates/GATE-BIZ-G0.md

    GateAuditRequest:
      type: object
      required: [customerId, gate, decision, decidedBy]
      properties:
        customerId:
          type: string
        gate:
          type: string
          description: 闸门标识（G0..G5）
          example: G1
        decision:
          type: string
          enum: [PASSED, BLOCKED, WAIVED]
        decidedBy:
          type: string
          description: 决策人
          example: user-zhangsan
        reason:
          type: string
          description: 决策原因

    GateAuditResponse:
      type: object
      description: |
        镜像记录回显。实现返回写入 `90_control/audit/gates.jsonl` 的**同一记录**再叠加
        `recorded`（`src/kert/application/skills.py:898-920`：`{"recorded": True, **rec}`）。

        **修正记录（2026-09-16，按实现核对）**：原声明 `timestamp`/`auditPath` 两个字段
        在实现中**不存在**；`recordedAt` 在实现中存在但原合同未声明。已按实现修正。
      required: [recorded, customerId, gate, decision, decidedBy, recordedAt]
      additionalProperties: false
      properties:
        recorded:
          type: boolean
        customerId:
          type: string
        gate:
          type: string
          example: G1
        decision:
          type: string
          enum: [PASSED, BLOCKED, WAIVED]
        decidedBy:
          type: string
        reason:
          type: string
          description: 决策原因（实现恒回显该键，可为空串）
        recordedAt:
          type: string
          format: date-time
          description: 记录时刻（实现生成，见 `skills.py:909`）

    InfrastructureErrorResponse:
      type: object
      description: |
        基础设施/领域异常响应。`KERTException` 经 `src/kert/api/server.py:308-316` 的 `_handle()`
        转为 `HTTPException(detail={"error": {...}})`，FastAPI 默认序列化为 `{"detail": ...}`
        ——即真实形状是**多一层 `detail` 包装**，与 `ErrorResponse` 不同。

        **修正记录（2026-09-16）**：新增。`/v1/jobs/{jobId}` 的 404 原误声明为 `ErrorResponse`，
        实测为 `{"detail":{"error":{"code":"ASSET_NOT_FOUND","message":...,"retryable":false}}}`。
        ⚠ 其余仍声明 `ErrorResponse` 的响应（如 `/api/skill/execute` 的 `400`/`500`）**尚未**按实测核对，
        属归并后续批次事项（见 `evidence/m7-3/CANDIDATE-CONTRACT-MERGE-V1-V2.md` §2.5-F4/F5 与 §6）。
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: object
          required: [error]
          additionalProperties: false
          properties:
            error:
              type: object
              required: [code, message, retryable]
              additionalProperties: false
              properties:
                code:
                  type: string
                  description: 领域错误码（`src/kert/domain/errors.py:24-44` 的 `ERROR_CODES`）
                  example: ASSET_NOT_FOUND
                message:
                  type: string
                retryable:
                  type: boolean

    ValidationErrorResponse:
      type: object
      description: |
        请求体校验失败响应（FastAPI / Pydantic 默认形状）：`{"detail": [ ... ]}`。
        用于 `/api/skill/execute` 的 `422`（该端点**没有** `400` 路径）。

        **修正记录（2026-09-16）**：新增。原合同对该端点声明 `400` + `ErrorResponse`，
        实测为 **422** + 本形状（`src/kert/api/server.py:619-643` 无 `try/except`，
        校验由 Pydantic 直接完成）。
        说明：`detail[]` 各项由 FastAPI 生成，字段集随校验错误类型而异，
        故此处**宽松描述**（只钉住 `type`/`loc`/`msg`/`input` 四个常见键）。
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: array
          items:
            type: object
            description: 单条校验错误（FastAPI 标准项）
            required: [type, loc, msg]
            properties:
              type:
                type: string
                example: missing
              loc:
                type: array
                items:
                  type: string
                example: ["body", "skillId"]
              msg:
                type: string
                example: Field required
              input:
                description: 触发错误的输入（可能缺席）
                additionalProperties: true
            additionalProperties: true

    StringDetailErrorResponse:
      type: object
      description: |
        `HTTPException(detail=<字符串>)` 的默认序列化形状：`{"detail": "<字符串>"}`。
        用于 `/api/skill/report/{requestId}` 的 `404`（`src/kert/api/server.py:653-657`）。

        **修正记录（2026-09-16）**：新增。原合同对该 404 未给响应体，实测为字符串 `detail`。
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: string

    ErrorResponse:
      type: object
      required: [requestId, status]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [skill_error, exit_policy_no_new_evidence]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: |
            错误码：
            - INVALID_PARAMETER: 请求参数错误
            - SKILL_NOT_FOUND: Skill 不存在
            - SKILL_EXECUTION_ERROR: Skill 执行错误
            - CONTEXT_VALIDATION_ERROR: 上下文验证失败
            - GATE_CHECK_FAILED: 闸门检查失败
            - JOB_NOT_FOUND: Job 不存在
            - INTERNAL_ERROR: 内部错误
            - KERT_PERMISSION_DENIED: 权限不允许
            - KERT_CONTEXT_INSUFFICIENT: 必须事实不足
            - KERT_PRODUCT_KNOWLEDGE_STALE: 产品知识版本失效
            - KERT_RULE_VERSION_MISSING: 规则不可复现
            - KERT_EXECUTION_TIMEOUT: 技术超时
            - KERT_CONTRACT_MISMATCH: 输入/输出不符合合同
            - KERT_EVIDENCE_INCOMPLETE: 结果缺乏必要证据
            - KERT_INTERNAL_ERROR: 未分类技术错误
            - UNKNOWN_SKILL: Skill 未注册（`/api/skill/execute` 返回 HTTP 404；
              响应体见 `SkillExecuteErrorResponse`，**不是**本 `ErrorResponse`）
        message:
          type: string
        detail:
          type: object
          additionalProperties: true

    SkillExecuteErrorResponse:
      type: object
      description: |
        `/api/skill/execute` 的**未知 Skill**（HTTP 404）响应体。
        与 200 **同构**（`status=skill_error`、`errors[].code=UNKNOWN_SKILL`），**不是** `ErrorResponse`。
        实现由 `src/kert/api/server.py:635-643` 直接复用同步结果体并以 404 返回
        （`status_code=404 if unknown else 200`）。

        **修正记录（2026-09-16，按实现核对）**：本 404 原误声明为 `ErrorResponse`
        （`requestId`/`status`/`errors`），与实现长期不符；GITS 调用方已按真实行为编码
        （`DshHttpSkillExecutionAdapter.java:32`：「未知 skillId → 404, errors[0].code=UNKNOWN_SKILL」），
        故按实现修正合同。
      required: [requestId, status, errors]
      additionalProperties: false
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [skill_error]
        data:
          type: object
          description: 错误路径下仅含 `reportUrl`（**不含** `skillId`）
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        assemblyTrace:
          type: array
          description: 装配追踪（失败路径同样返回；条目见 `docs/contracts/schemas/assembly-trace.schema.json`）
          items:
            type: object
            additionalProperties: true
        modelCalls:
          type: array
          items:
            type: object
            additionalProperties: true

    # ── v1.5 增量：知识路由与激活计划（纯新增；见 CONTRACT_CHANGE_PROPOSAL_ROUTING_API.md）──
    PlanAsset:
      type: object
      required: [assetId, required, sequence]
      properties:
        assetId:
          type: string
          description: 资产（知识条目）ID
        required:
          type: boolean
        sequence:
          type: integer
          minimum: 1
          description: 激活顺序（同一地图内唯一）
    PlanDenial:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
          description: |
            拒绝码（**三族并列，互不混用**）：
            - `ROUTE_*`：策略缺失 / 任务未映射 / 同优先级歧义 / 地图未注册 / 策略错配
            - `KNOWLEDGE_MAP_*`：地图注册与解析（未注册 / 未映射 / 歧义）
            - `ONTOLOGY_REFERENCE_*`：本体引用缺失（`ONTOLOGY_REFERENCE_ABSENT`）或非法（`ONTOLOGY_REFERENCE_INVALID`）
        reason:
          type: string
          description: 人类可读的拒绝原因（含可排障信息）
    ActivationPlan:
      type: object
      description: "激活计划快照；字段与实现 ActivationPlan.to_dict() 逐字段一致"
      required: [schema, planId, taskType, subjectId, routeReason, versions, assets, skills, planHash]
      properties:
        schema:
          type: string
          enum: [activation_plan/v1]
        planId:
          type: string
          description: 由 planHash 派生（确定性）
        taskType:
          type: string
        subjectId:
          type: string
          nullable: true
          description: 主体标识；仅记录，**不**入 planHash
        routeReason:
          type: string
          description: 路由理由（必须可解释）
        versions:
          type: object
          description: "版本快照；ontology 为「契约引用 + 内容哈希版本」形式（如 CTR-SEM-002@sha256:…）"
          properties:
            knowledgeMap:
              type: string
              nullable: true
            routePolicy:
              type: string
              nullable: true
            activationContract:
              type: string
              nullable: true
            ontology:
              type: string
              nullable: true
        assets:
          type: array
          items:
            $ref: "#/components/schemas/PlanAsset"
        skills:
          type: array
          items:
            type: string
        planHash:
          type: string
          description: 可重放计划哈希（sha256 前 16 位）；只覆盖确定性字段，**不含**主体/权限/时刻/路径
    RoutingPlanRequest:
      type: object
      required: [taskType]
      additionalProperties: false
      properties:
        taskType:
          type: string
          example: PRE_VISIT_PREPARATION
        subjectId:
          type: string
          description: 主体标识（如 customerId）；仅记录，不影响 planHash
    RoutingPlanResponse:
      type: object
      description: "标准响应信封（与 /v1/* 其余端点一致）；裁决结果在 data 内。修正记录：v1.5 初版误把 allowed 写在顶层，已改正（2026-09-16）。"
      required: [request_id, status, data]
      properties:
        request_id:
          type: string
        status:
          type: string
        data:
          type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
              description: 只可能为 true（带 plan）或 false（带 denial）——**没有第三态**
            plan:
              description: "allowed=true 时存在"
              allOf:
                - $ref: "#/components/schemas/ActivationPlan"
            denial:
              description: "allowed=false 时存在"
              allOf:
                - $ref: "#/components/schemas/PlanDenial"
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    KnowledgeMapSummary:
      type: object
      required: [mapId, version, domain, tasks, priority, assetCount, skillCount]
      properties:
        mapId:
          type: string
        version:
          type: string
        title:
          type: string
          nullable: true
        domain:
          type: string
        tasks:
          type: array
          items:
            type: string
        priority:
          type: integer
        assetCount:
          type: integer
        skillCount:
          type: integer
        routePolicyRef:
          type: string
          nullable: true
    KnowledgeMapListResponse:
      type: object
      required: [request_id, status, data]
      properties:
        request_id:
          type: string
        status:
          type: string
        data:
          type: object
          required: [maps, count]
          properties:
            maps:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeMapSummary"
            count:
              type: integer
            policy:
              type: object
              nullable: true
              properties:
                policyId:
                  type: string
                version:
                  type: string
                defaultDecision:
                  type: string
    KnowledgeMapDetail:
      type: object
      required: [request_id, status, data]
      properties:
        request_id:
          type: string
        status:
          type: string
        data:
          $ref: "#/components/schemas/KnowledgeMapSummary"
