# DKWS CI/CD Pipeline
#
# 触发条件：push 到 main/develop 分支，PR 到 main/develop
# 关键约束：CI 在无密钥环境下运行，使用 DKWS_PROFILE=dev（默认值，无需 API Key）

name: DKWS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # 必须含 develop：feature 分支按流程 PR 到 develop，
    # 若只监听 main，则所有 feature PR 在合并前都不会被 CI 验证。
    branches: [main, develop]

# 同一分支/PR 只保留最新运行，取消旧的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CI 环境：dev profile 无需 API Key，测试使用确定性逻辑
  DKWS_PROFILE: dev

jobs:
  # ──────────────────────────────────────────────
  # Lint：代码风格 + 类型检查
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # ruff/mypy 不在 dev 依赖中，单独安装用于 CI 检查
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Mypy type check
        run: |
          pip install ".[api]"
          mypy src/dkws/ --ignore-missing-imports || true
          # mypy 初次集成：仅报告，不阻塞 CI
          # 后续收紧：移除 || true，添加 strict 选项

  # ──────────────────────────────────────────────
  # Test：单元测试 + 覆盖率
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]" pytest-cov
          else
            pip install ".[api,dev]" pytest-cov
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=dkws \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            -q
        env:
          DKWS_PROFILE: dev

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          retention-days: 30

  # ──────────────────────────────────────────────
  # E2E：端到端集成测试
  # ──────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      - name: Run E2E tests
        run: python -m pytest tests/e2e/ -q
        env:
          DKWS_PROFILE: dev

  # ──────────────────────────────────────────────
  # Security：安全测试
  # ──────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      - name: Run security tests
        run: python -m pytest tests/security/ -q
        env:
          DKWS_PROFILE: dev

  # ──────────────────────────────────────────────
  # Performance：性能基准（允许失败）
  # ──────────────────────────────────────────────
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      - name: Run performance benchmarks
        run: python -m pytest tests/performance/ -q
        env:
          DKWS_PROFILE: dev
