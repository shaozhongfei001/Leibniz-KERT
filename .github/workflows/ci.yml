# KERT CI/CD Pipeline
#
# 触发条件：push 到 main/develop 分支，PR 到 main/develop
# 关键约束：CI 在无密钥环境下运行，使用 KERT_PROFILE=dev（默认值，无需 API Key）

name: KERT CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # 必须含 develop：feature 分支按流程 PR 到 develop，
    # 若只监听 main，则所有 feature PR 在合并前都不会被 CI 验证。
    branches: [main, develop]

# 同一分支/PR 只保留最新运行，取消旧的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CI 环境：dev profile 无需 API Key，测试使用确定性逻辑
  KERT_PROFILE: dev

jobs:
  # ──────────────────────────────────────────────
  # Lint：代码风格 + 类型检查
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # ruff/mypy 不在 dev 依赖中，单独安装用于 CI 检查。
          # 必须锁版本：ruff 的默认规则集随版本扩张，不锁版本会让
          # 工具升级凭空引入与代码改动无关的红灯（见 FAIL-JR1-05 F-1）。
          pip install ruff==0.16.4 mypy==2.3.1

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Mypy type check
        run: |
          pip install ".[api]"
          mypy src/kert/ --ignore-missing-imports || true
          # mypy 初次集成：仅报告，不阻塞 CI
          # 后续收紧：移除 || true，添加 strict 选项

  # ──────────────────────────────────────────────
  # Test：单元 + 集成 + 契约 + 恢复测试 + 覆盖率
  #
  # 作用域显式列出，排除 e2e / security / performance（各有专职 job）。
  # 此前本 job 跑无参数 pytest（testpaths=["tests"]）导致与三个专职 job
  # 重叠，且与 performance job 的 continue-on-error 语义矛盾——同一批
  # 基准用例在此阻断、在那放行（见 FAIL-JR1-05 F-2）。
  #
  # contract 与 recovery 必须列入：二者无专职 job，此前仅靠无参数
  # pytest 被间接执行。若省略，JR-1 内部契约测试将脱离 CI 验证。
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]" pytest-cov
          else
            pip install ".[api,dev]" pytest-cov
          fi

      - name: Run tests with coverage
        run: |
          python -m pytest \
            tests/unit/ tests/integration/ tests/contract/ tests/recovery/ \
            --cov=kert \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            -q
        env:
          KERT_PROFILE: dev

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html/
          retention-days: 30

  # ──────────────────────────────────────────────
  # E2E：端到端集成测试
  #
  # 本 job **真启动 KERT（本仓代码，dev profile + 确定性适配器）**，使本仓可跑的
  # 26 个用例真跑；需 GITS 后端/前端的 21 个跨服务用例显式 skip 并登记为缺口
  # F-E2E-01（清单见 evidence/kert-e2e-ci/WAIVER-E2E-CROSS-SERVICE.md）。
  # 覆盖口径：26/47 真跑，21/47 未覆盖 —— CI 绿 ≠ 跨服务链路已验证。
  #
  # 防假绿（TECH_LEAD_DECISION D-5 边界 1 / D-8）：KERT 未起来时**必须** job 失败，
  # 禁止以「全 skip 后变绿」掩盖。三道防线：
  #   ① 启动步骤自身等就绪；未就绪/端口被占 → exit 1；
  #   ② E2E_REQUIRE_KERT=1 → 需要 KERT 的用例在 KERT 缺失时 fail，禁止降级为 skip；
  #   ③ 覆盖账本下限断言（conftest 的 session 钩子 + 下方独立步骤，双重）。
  # 不用 continue-on-error：本 job 的失败必须阻断。
  # ──────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      # ──────────────────────────────────────────────
      # D-6 Step 1：显式供给控制面 + 供给就绪断言（Owner 已批方向）
      #
      # 根因（实测，见 evidence/m7-3/PLAN_D-6-E2E-ASSERTION-STRENGTHENING.md）：
      # 本 job 此前用**空** `$RUNNER_TEMP/kert-ws` 起服务，而 deploy 编排是
      # `provision --init` 先行（deploy/docker-compose.yml:28-52）⇒ **CI 与部署口径不一致** ⇒
      # 三技能计划门禁拒绝，却因 `/api/skill/execute` 对业务错误仍返回 200 而**假绿**。
      #
      # ⚠ 本批**只做 Step 1**（供给 + 就绪断言）；**Step 2**（把 e2e 断言强化到能区分
      #   `ok`/`skill_error`）**未做**，仍待放行 —— 否则 CI 会永久红。
      # ──────────────────────────────────────────────
      - name: Provision control plane into e2e workspace (D-6 Step 1)
        env:
          KERT_PROFILE: dev
        run: |
          set -euo pipefail
          # 与 deploy 编排同口径：`kert provision`（console script 由 `pip install ".[api,dev]"` 安装）
          mkdir -p "$RUNNER_TEMP/kert-ws"
          kert provision \
            -w "$RUNNER_TEMP/kert-ws" \
            -s "${{ github.workspace }}/examples/bank-front-knowledge-maps" \
            --init
          echo "✓ 控制面已供给：$RUNNER_TEMP/kert-ws"

      - name: Assert control-plane provisioning present (D-6 Step 1)
        env:
          KERT_E2E_SRC: ${{ github.workspace }}/examples/bank-front-knowledge-maps
          KERT_E2E_WS: ${{ runner.temp }}/kert-ws
        run: |
          # 就绪判据**不得**是 HTTP 200（那正是假绿的成因）⇒ 改为「**逐份声明文件存在 +
          # 内容 sha256 一致 + 防空转下限**」；缺一份即数秒内显式失败。
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          SRC = pathlib.Path(os.environ["KERT_E2E_SRC"])
          WS = pathlib.Path(os.environ["KERT_E2E_WS"])
          #: 说明件不属"声明"（不被供给、不参与判据）
          NON_DECL = {"README.md", "PROVENANCE.md"}

          def decl(root: pathlib.Path) -> dict:
              out = {}
              for p in (root / "90_control").rglob("*"):
                  if p.is_file() and p.name not in NON_DECL:
                      out[p.relative_to(root).as_posix()] = hashlib.sha256(
                          p.read_bytes()).hexdigest()
              return out

          want = decl(SRC)
          got = decl(WS)
          missing = sorted(set(want) - set(got))
          diff = sorted(k for k in set(want) & set(got) if want[k] != got[k])
          print("控制面声明：应供给 %d 份 / 已落盘 %d 份" % (len(want), len(got)))
          # 防空转下限 = **稳定核心 6 份**（3 地图 + route_policy + ontology_reference +
          # knowledge_sources —— 均为**已入库**文件）。
          # ⚠ 为何不写 8：`schema/activations/AC-*.json`（2 份）当前是**第三方在途**新增、
          # **尚未入库**；若把下限写成 8，这些文件未入库时本 job 会**假红**。
          # 故口径为：源侧声明什么就要求供给什么（含 sha256 一致），但**下限只取入库核心 6 份**。
          if len(want) < 6:
              print("::error::防空转失败：源控制面声明数 %d < 6（入库核心）—— 检查 %s" % (len(want), SRC))
              sys.exit(1)
          if missing or diff:
              print("::error::控制面供给不完整：缺少 %s；内容不一致 %s" % (missing, diff))
              sys.exit(1)
          print("✓ 控制面供给就绪：%d 份声明逐份存在且内容 sha256 一致" % len(want))
          PY

      - name: Start KERT (dev profile, deterministic adapters)
        env:
          # dev profile 无需 API Key；无 LLM 密钥时自动走确定性适配器
          KERT_PROFILE: dev
          # 显式指定外部 Skill 包（bank-front-*）。必须显式：本 job 用非 editable 安装
          # （pip install ".[api,dev]"），内置默认值依赖 __file__ 的 parents[3]，会落到
          # site-packages 之外从而命中不到任何技能包，且在修复前是静默降级
          # （表现为运行时 UNKNOWN_SKILL）。见 evidence/kert-e2e-ci/TASK_PACKAGE_D-E2E-01.md。
          KERT_SKILL_PACKAGES: ${{ github.workspace }}/examples/bank-front-skills
        run: |
          set -euo pipefail
          # 拒绝复用已在 8106 上运行的外部实例（TECH_LEAD_DECISION §0.3：
          # 非本仓检出会产出与本次改动无关的假象，不得作为证据）。
          if curl -fsS --max-time 2 http://127.0.0.1:8106/api/skill/health > /dev/null 2>&1; then
            echo "::error::8106 上已有实例在监听，拒绝复用外部实例（须由本 job 启动本仓代码）"
            exit 1
          fi
          # 空 HOME：复现 CI 的「无密钥」环境，强制确定性适配器
          mkdir -p "$RUNNER_TEMP/kert-home" "$RUNNER_TEMP/kert-ws"
          # 本目录由上方 "Provision control plane into e2e workspace (D-6 Step 1)" 步供给；此处 mkdir 仅兜底（已存在则 no-op）。D-19：原文「空目录即可作 workspace，无需 `kert init`」在 Step 1 落地后已过时。
          nohup env HOME="$RUNNER_TEMP/kert-home" \
            python scripts/serve_skill_service.py \
              --port 8106 --host 127.0.0.1 --workspace "$RUNNER_TEMP/kert-ws" \
            > "$RUNNER_TEMP/kert.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kert.pid"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8106/api/skill/health > /dev/null; then
              echo "KERT 就绪（第 ${i} 秒）：GET /api/skill/health = 200"
              exit 0
            fi
            sleep 1
          done
          echo "::error::KERT 未能在 60 秒内于 127.0.0.1:8106 就绪，e2e 无法真跑——拒绝以 skip 掩盖"
          cat "$RUNNER_TEMP/kert.log"
          exit 1

      - name: Assert KERT skill readiness (D-E2E-01)
        run: |
          # 技能就绪断言：把「外部技能缺失」从 10 条用例失败变成数秒内的显式失败。
          # 端点用 /api/skill/health —— 该服务唯一的技能清单端点（不存在 /api/skill/list），
          # 与 Start KERT 的就绪探针同一端点。
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          base = os.environ.get("KERT_BASE_URL", "http://127.0.0.1:8106")
          expected = [
              "bank-front-commitment-script",
              "bank-front-eight-dimension",
              "bank-front-fact-reconciliation",
              "bank-front-kyc-gap-check",
              "bank-front-product-recommendation",
              "bank-front-report-assembler",
              "bank-front-supply-chain-graph",
          ]
          with urllib.request.urlopen(base + "/api/skill/health", timeout=10) as resp:
              body = json.load(resp)
          available = {s["skillId"] for s in body.get("skills", [])}
          print("已注册技能 %d 个：%s" % (len(available), sorted(available)))
          missing = [s for s in expected if s not in available]
          if missing:
              print("::error::外部 Skill 包未就绪，缺少 %d 个：%s —— 检查 KERT_SKILL_PACKAGES=%s"
                    % (len(missing), missing, os.environ.get("KERT_SKILL_PACKAGES")))
              sys.exit(1)
          print("✓ 技能就绪：%d 个 bank-front-* 全部存在" % len(expected))
          PY

      - name: Run E2E tests
        run: |
          # 注意：pyproject 的 addopts 已含 -q，此处再传 -q 会变成 -qq，
          # 连「N passed, M skipped」汇总行都会被抑制 —— 只传 -rs 打印 skip reason。
          python -m pytest tests/e2e/ -rs
        env:
          KERT_PROFILE: dev
          # 服务维度 require（TECH_LEAD_DECISION D-7）：KERT 缺失 → fail，禁止 skip。
          # 不设 GITS 侧 require：跨服务用例按既定口径显式 skip + 登记（F-E2E-01）。
          E2E_REQUIRE_KERT: "1"
          # 覆盖账本落盘，供下方独立断言步骤核验
          E2E_LEDGER_PATH: ${{ runner.temp }}/e2e-coverage-ledger.json

      - name: Assert E2E coverage ledger
        run: |
          # 独立于 pytest 内部钩子的第二道下限断言（TECH_LEAD_DECISION D-8）：
          # 口径为「errors=0 且 failed=0 且 passed>=下限 且 skipped<=上限」，
          # 下限/上限由账本中按文件列出的分组**现场重算**，不信任账本自报的结论。
          python - <<'PY'
          import json
          import os
          import sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "e2e-coverage-ledger.json")
          if not os.path.exists(path):
              print("::error::覆盖账本缺失（%s）——pytest 未正常完成，拒绝判定为通过" % path)
              sys.exit(1)
          with open(path, encoding="utf-8") as fh:
              ledger = json.load(fh)
          groups = ledger["groups"]
          expected_min = len(groups["no_service"]) + len(groups["kert_only"])
          expected_max = len(groups["gits_only"]) + len(groups["multi_end"])
          print("E2E 覆盖账本：collected=%d passed=%d skipped=%d failed=%d errors=%d"
                % (ledger["collected"], ledger["passed"], ledger["skipped"],
                   ledger["failed"], ledger["errors"]))
          print("  下限 passed>=%d（无服务 %d + 仅 KERT %d）"
                % (expected_min, len(groups["no_service"]), len(groups["kert_only"])))
          print("  上限 skipped<=%d（仅 GITS %d + 多端/含前端 %d）"
                % (expected_max, len(groups["gits_only"]), len(groups["multi_end"])))
          print("  覆盖口径：%s" % ledger["coverage"])
          for nodeid, reason in sorted(ledger["uncovered_reasons"].items()):
              print("  未覆盖（显式登记，非通过）：%s  [%s]" % (nodeid, reason))
          problems = []
          if ledger["errors"] != 0:
              problems.append("errors=%d（必须 0）" % ledger["errors"])
          if ledger["failed"] != 0:
              problems.append("failed=%d（必须 0）" % ledger["failed"])
          if ledger["passed"] < expected_min:
              problems.append("passed=%d < 下限 %d" % (ledger["passed"], expected_min))
          if ledger["skipped"] > expected_max:
              problems.append("skipped=%d > 上限 %d" % (ledger["skipped"], expected_max))
          if ledger["collected"] != (ledger["passed"] + ledger["skipped"]
                                     + ledger["failed"] + ledger["errors"]):
              problems.append("计数不自洽：collected=%d，四态之和=%d"
                              % (ledger["collected"],
                                 ledger["passed"] + ledger["skipped"]
                                 + ledger["failed"] + ledger["errors"]))
          if problems:
              for problem in problems:
                  print("::error::E2E 覆盖账本下限断言失败：%s" % problem)
              sys.exit(1)
          print("✓ 覆盖账本下限断言通过（errors=0, failed=0, passed>=%d, skipped<=%d）"
                % (expected_min, expected_max))
          PY

      - name: Upload E2E coverage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-ledger
          path: ${{ runner.temp }}/e2e-coverage-ledger.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # Security：安全测试
  # ──────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      - name: Run security tests
        run: python -m pytest tests/security/ -q
        env:
          KERT_PROFILE: dev

  # ──────────────────────────────────────────────
  # Performance：性能基准（允许失败）
  # ──────────────────────────────────────────────
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -c requirements-lock.txt ".[api,dev]"
          else
            pip install ".[api,dev]"
          fi

      - name: Run performance benchmarks
        # D-10：默认套件（pyproject addopts）排除 `perf` 标记。本 job 是专职基准 job，
        # 故显式覆盖为"全部包含"（`-m` 以最后一次出现的表达式为准）；否则本 job 会
        # 静默变成"零用例通过"，把墙钟 flake 洗成绿。
        run: python -m pytest tests/performance/ -q -m "perf or not perf"
        env:
          KERT_PROFILE: dev
