# Dependabot 配置
# https://docs.github.com/en/code-security/dependabot/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Python pip 依赖
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
